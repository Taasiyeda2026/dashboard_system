project_id = "dashboard_system"

[remotes.main]
project_id = "szinlhjuwyiyszdpsdop"


# Production identity-provider settings. Keep local OAuth redirects separate.
# Never run `supabase config push` against this project: CLI defaults may overwrite live
# Auth settings, including values NOT declared here. Review remote changes manually.
[remotes.main.auth]
site_url = "https://taasiyeda2026.github.io/dashboard_system"
# Preserve the two entries already present in production at the time of this change.
additional_redirect_urls = [
  "https://127.0.0.1:3000",
  "https://taasiyeda2026.github.io/dashboard_system",
]

[remotes.main.auth.oauth_server]
enabled = true
authorization_url_path = "/scheduling-agent-approval.html"
allow_dynamic_registration = true

[remotes.main.auth.email.template.recovery]
subject = "קוד אימות לאיפוס הכניסה – תעשיידע"
content_path = "./supabase/templates/recovery.html"

# Cron authenticates with its dedicated server-only secret, never a user JWT.
# Deployment and live delivery still require separate approval.
[functions.feedback-staff-automation]
verify_jwt = false

# User identity is verified with Auth getUser, then a DB-bound owner permission.
# No service-role key and no anonymous RPC/table access. Commits remain disabled.
[functions.scheduling-agent-gateway]
verify_jwt = false

# Dedicated server-only wake secret; handler rejects missing/invalid secret.
[functions.scheduling-agent-wakeup]
verify_jwt = false

# GitHub OIDC is verified against the exact main-branch workflow inside handler.
[functions.scheduling-agent-worker-api]
verify_jwt = false
