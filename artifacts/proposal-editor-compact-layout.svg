<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#eef3f8"/>
  <foreignObject x="35" y="30" width="1370" height="840">
    <div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="font-family:Arial,sans-serif;color:#1e293b;background:white;border:1px solid #cbd5e1;border-radius:16px;padding:24px;box-sizing:border-box;height:100%">
      <style>
        .row{display:flex;justify-content:flex-start;align-items:flex-end;gap:10px;margin:12px 0}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe3ec;padding-bottom:16px}.btn{height:36px;border:1px solid #94a3b8;border-radius:8px;background:#fff;padding:0 12px;font-size:14px}.top{width:154px}.choice{width:92px;height:34px}.selected{border-color:#4f46e5;background:#eef2ff;color:#4338ca;font-weight:700}.section{border:1px solid #d7e3ef;border-radius:12px;padding:14px;margin-top:16px}.label{display:block;color:#64748b;font-size:12px;font-weight:700;margin-bottom:5px}.field{height:38px;border:1px solid #94a3b8;border-radius:8px;background:#fff;padding:0 10px;box-sizing:border-box;font-size:14px}.activity{width:420px}.qty{width:80px}.discount-type{width:150px}.discount-value{width:90px}.discount-note{width:240px}.trash{width:36px;padding:0}.edit{width:auto}.summary{display:inline-block;background:#f8fafd;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;margin-top:16px}.caption{font-size:12px;color:#64748b;margin-top:4px}
      </style>
      <div class="head"><h2 style="margin:0">יצירת הצעת מחיר</h2><div class="row" style="margin:0"><button class="btn top">שמירת טיוטה</button><button class="btn top">← חזרה לתיק הלקוח</button></div></div>
      <div class="section"><span class="label">סוג נמען</span><div class="row"><button class="btn choice selected">בית ספר</button><button class="btn choice">רשות</button><button class="btn choice">אחר</button></div><div class="caption">כל כפתורי הקבוצה: 92 × 34 פיקסלים</div></div>
      <div class="section"><span class="label">סוג הצעה</span><div class="row"><button class="btn choice selected">תשפ״ז</button><button class="btn choice">גפן</button><button class="btn choice">סיור</button></div><div class="caption">כל כפתורי הקבוצה: 92 × 34 פיקסלים</div></div>
      <div class="section"><h3 style="margin:0 0 12px">פעילויות</h3><div class="row"><div><span class="label">פעילות</span><select class="field activity"><option>תוכנית לדוגמה – פעילות בית ספרית</option></select></div><div><span class="label">כמות</span><input class="field qty" type="number" value="1"/></div><button class="btn edit">עריכה</button><button class="btn trash" title="מחיקה">🗑</button></div><div class="caption">פעילות 420px | כמות 80px | עריכה לפי הטקסט | מחיקה לפי האייקון</div></div>
      <div class="summary"><div style="font-weight:700;margin-bottom:8px">הנחה / תוספת</div><div class="row" style="margin:0"><div><span class="label">סוג הנחה או תוספת</span><select class="field discount-type"><option>הנחה ₪</option></select></div><div><span class="label">סכום או אחוז</span><input class="field discount-value" type="number" value="100"/></div><div><span class="label">הערת הנחה</span><input class="field discount-note" value="הנחת לקוח"/></div></div><div class="caption">האזור והשדות נקבעים לפי התוכן ואינם נמתחים</div></div>
    </div>
  </foreignObject>
</svg>
