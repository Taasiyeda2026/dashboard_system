    async function gunzipBase64(value) {
      if (typeof DecompressionStream !== 'function') {
        throw new Error('הדפדפן אינו תומך בטעינת הממשק. יש לפתוח בדפדפן מעודכן.');
      }
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    try {
      const [css, javascript] = await Promise.all([
        gunzipBase64(CSS_GZIP_BASE64),
        gunzipBase64(JS_GZIP_BASE64)
      ]);
      const style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);
      const moduleUrl = URL.createObjectURL(new Blob([javascript], { type: 'text/javascript' }));
      await import(moduleUrl);
      URL.revokeObjectURL(moduleUrl);
    } catch (error) {
      console.error(error);
      document.getElementById('app').innerHTML = `<main style="min-height:100vh;display:grid;place-content:center;padding:24px;text-align:center;font-family:Arial,sans-serif"><div><h1>לא ניתן לטעון את המשוב</h1><p>${String(error?.message || error)}</p><a href="../">חזרה לדשבורד</a></div></main>`;
    }
