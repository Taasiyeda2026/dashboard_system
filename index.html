  <style id="client-file-row-alignment-v2">
    #app .ds-client-file.is-layout-polished {
      grid-template-columns: minmax(360px, .9fr) minmax(500px, 1.45fr) !important;
      grid-template-rows: auto auto !important;
      column-gap: 18px !important;
      row-gap: 12px !important;
      max-width: 1200px !important;
    }
    #app .ds-client-file.is-layout-polished > .ds-client-file__header {
      grid-column: 1 / -1 !important;
      grid-row: 1 !important;
    }
    #app .ds-client-file.is-layout-polished > .ds-client-file__identity,
    #app .ds-client-file.is-layout-polished > .ds-client-file__proposals {
      grid-row: 2 !important;
      align-self: start !important;
    }
    @media (max-width: 1000px) {
      #app .ds-client-file.is-layout-polished {
        grid-template-columns: 1fr !important;
        grid-template-rows: auto auto auto !important;
      }
      #app .ds-client-file.is-layout-polished > .ds-client-file__identity {
        grid-row: 2 !important;
      }
      #app .ds-client-file.is-layout-polished > .ds-client-file__proposals {
        grid-row: 3 !important;
      }
    }
  </style>
  <title>Dashboard-Taasiyeda</title>
</head>
