name: Apply manager attendance summary count fix

on:
  push:
    branches:
      - codex/fix-manager-attendance-summary-count-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manager = Path('frontend/src/manager-board-workspace-runtime.js')
          src = manager.read_text(encoding='utf-8')
          old = """    for (const row of Array.isArray(records) ? records : []) {\n      const empId = rawEmployeeId(row);\n      if (!recordCounts.has(empId) || rawRecordMonth(row) !== ym) continue;\n      recordCounts.set(empId, (recordCounts.get(empId) || 0) + 1);\n    }\n"""
          new = """    for (const row of Array.isArray(records) ? records : []) {\n      const empId = rawEmployeeId(row);\n      if (!recordCounts.has(empId) || rawRecordMonth(row) !== ym) continue;\n      const generationKind = text(row?.generationKind || row?.generation_kind);\n      if (generationKind === 'travel_time_cancellation') continue;\n      recordCounts.set(empId, (recordCounts.get(empId) || 0) + 1);\n    }\n"""
          if old not in src:
              raise SystemExit('manager summary loop target not found')
          src = src.replace(old, new, 1)
          old_label = '<span class="manager-workspace-report-count">קיים · ${count} רשומות</span>'
          new_label = '<span class="manager-workspace-report-count">קיים · ${count} דיווחים</span>'
          if old_label not in src:
              raise SystemExit('manager summary label target not found')
          src = src.replace(old_label, new_label, 1)
          manager.write_text(src, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_asset = 'manager-board-workspace-runtime.js?v=20260916-attendance-control-parity-v1'
          new_asset = 'manager-board-workspace-runtime.js?v=20260916-attendance-summary-count-v2'
          if old_asset not in html:
              raise SystemExit('manager workspace asset version target not found')
          index.write_text(html.replace(old_asset, new_asset, 1), encoding='utf-8')

          sw = Path('frontend/sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if 'const CACHE_VERSION = 1722;' not in sw_text:
              raise SystemExit('CACHE_VERSION 1722 target not found')
          sw.write_text(sw_text.replace('const CACHE_VERSION = 1722;', 'const CACHE_VERSION = 1723;', 1), encoding='utf-8')

          config = Path('frontend/src/config.js')
          cfg = config.read_text(encoding='utf-8')
          anchor = "config.HOTFIX_VERSION = `attendance-control-travel-admin-pdf-sw-cache-1722-20260916-v1-${config.HOTFIX_VERSION}`;"
          marker = "config.HOTFIX_VERSION = `manager-attendance-summary-count-sw-cache-1723-20260916-v1-${config.HOTFIX_VERSION}`;"
          if marker not in cfg:
              if anchor not in cfg:
                  raise SystemExit('config hotfix anchor not found')
              cfg = cfg.replace(anchor, anchor + '\n' + marker, 1)
              config.write_text(cfg, encoding='utf-8')

          for test_path in Path('tests').glob('*.test.mjs'):
              text = test_path.read_text(encoding='utf-8')
              changed = text.replace('const CACHE_VERSION = 1722;', 'const CACHE_VERSION = 1723;')
              changed = changed.replace(
                  'manager-board-workspace-runtime\\.js\\?v=20260916-attendance-control-parity-v1',
                  'manager-board-workspace-runtime\\.js\\?v=20260916-attendance-summary-count-v2'
              )
              if changed != text:
                  test_path.write_text(changed, encoding='utf-8')

          regression = Path('tests/manager-attendance-summary-count.test.mjs')
          regression.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst source = await readFile(new URL('../frontend/src/manager-board-workspace-runtime.js', import.meta.url), 'utf8');\n\ntest('manager summary excludes generated travel-time cancellation rows from the displayed report count', () => {\n  assert.match(source, /const generationKind = text\\(row\\?\\.generationKind \\|\\| row\\?\\.generation_kind\\);/);\n  assert.match(source, /if \\(generationKind === 'travel_time_cancellation'\\) continue;/);\n  assert.match(source, /קיים · \\${count} דיווחים/);\n});\n\ntest('manager summary still counts ordinary attendance rows', () => {\n  assert.match(source, /recordCounts\\.set\\(empId, \\(recordCounts\\.get\\(empId\\) \\|\\| 0\\) \\+ 1\\);/);\n});\n\ntest('cache markers are bumped for the manager summary fix', async () => {\n  const index = await readFile(new URL('../index.html', import.meta.url), 'utf8');\n  const sw = await readFile(new URL('../frontend/sw.js', import.meta.url), 'utf8');\n  const config = await readFile(new URL('../frontend/src/config.js', import.meta.url), 'utf8');\n  assert.match(index, /manager-board-workspace-runtime\\.js\\?v=20260916-attendance-summary-count-v2/);\n  assert.match(sw, /const CACHE_VERSION = 1723;/);\n  assert.match(config, /manager-attendance-summary-count-sw-cache-1723-20260916-v1/);\n});\n""", encoding='utf-8')
          PY

      - name: Run focused tests
        run: |
          node --test tests/manager-attendance-summary-count.test.mjs tests/manager-workspace-contract.test.mjs

      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-manager-attendance-summary-count.yml
          git add frontend/src/manager-board-workspace-runtime.js frontend/sw.js frontend/src/config.js index.html tests
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit -m "Fix manager attendance report count"
          git push origin HEAD:${GITHUB_REF_NAME}
