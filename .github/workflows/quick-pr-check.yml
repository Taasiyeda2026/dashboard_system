name: Quick PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: quick-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: select changed-file checks
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.plan.outputs.postgres }}
      work: ${{ steps.plan.outputs.work }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate selector and select focused checks
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run check:ci-plan
          PLAN="$(node scripts/check_changed.mjs --json)"
          echo "Selected plan: $PLAN"
          echo "postgres=$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.postgres))' "$PLAN")" >> "$GITHUB_OUTPUT"
          echo "work=$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(p.build || p.tests.length || p.syntaxFiles.length)))' "$PLAN")" >> "$GITHUB_OUTPUT"

  focused-checks:
    name: focused syntax, tests and build
    needs: select
    if: needs.select.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run changed-file plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run ci:quick

  scheduling-postgres:
    name: scheduling Postgres contract
    needs: select
    if: needs.select.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduling_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduling_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/course-scheduling-draft-concurrency.test.mjs
      - run: node --test tests/course-scheduling-stage3-live-db.test.mjs
