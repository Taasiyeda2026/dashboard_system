name: Quick PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: quick-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fix controller syntax on branch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/screens/operations-2027-loading-controller.js')
          text = path.read_text()
          old = "const displayedIds = new Set(data.courses.map((course) => String(course.id || ''));"
          new = "const displayedIds = new Set(data.courses.map((course) => String(course.id || '')));"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add frontend/src/screens/operations-2027-loading-controller.js
            git commit -m "Fix Operations 2027 controller syntax"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operations 2027 syntax check
        run: node --check frontend/src/screens/operations-2027-loading-controller.js

      - name: Build check
        run: npm run check:build

      - name: PWA cache guardrails check
        run: npm run check:pwa

      - name: Focused course scheduling tests
        run: |
          git fetch --no-tags --depth=1 origin main
          node --test tests/course-scheduling-*.test.mjs
