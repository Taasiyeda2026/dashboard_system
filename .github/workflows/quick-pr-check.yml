name: Quick PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: quick-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operations 2027 syntax check
        run: |
          node --check frontend/src/screens/operations-2027-loading-controller.js
          node --check frontend/src/screens/operations-summer-training-matrix.js

      - name: Operations 2027 focused tests
        run: |
          for test_file in tests/operations-2027-*.test.mjs tests/operations-lazy-loading.test.mjs; do
            echo "=== $test_file ==="
            timeout 40s node --test "$test_file"
          done

      - name: Build check
        run: npm run check:build

      - name: PWA cache guardrails check
        run: npm run check:pwa

      - name: Focused course scheduling tests
        run: |
          git fetch --no-tags --depth=1 origin main
          node --test tests/course-scheduling-*.test.mjs
