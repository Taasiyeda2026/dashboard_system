name: Quick PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: quick-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run check:build

      - name: PWA cache guardrails check
        run: npm run check:pwa

      - name: Focused course scheduling tests
        run: |
          # shallow PR checkouts omit origin/main; the cache-version guard compares against it
          git fetch --no-tags --depth=1 origin main
          node --test tests/course-scheduling-*.test.mjs

  scheduling-postgres:
    name: scheduling-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduling_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run disposable Postgres scheduling tests
        run: |
          node --test tests/course-scheduling-draft-concurrency.test.mjs
          node --test tests/course-scheduling-final-consistency-postgres.test.mjs
