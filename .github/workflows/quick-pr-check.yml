name: Quick PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: quick-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run check:build

      - name: PWA cache guardrails check
        run: npm run check:pwa

      - name: Focused course scheduling tests
        run: node --test tests/course-scheduling-*.test.mjs
