name: Validate calendar layers

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/birthday-calendar.js'
      - 'frontend/src/school-calendar-runtime.js'
      - 'frontend/src/team-calendar-runtime.js'
      - 'frontend/src/feature-loaders.js'
      - 'frontend/src/screens/month.js'
      - 'frontend/src/screens/week.js'
      - 'frontend/src/screens/shared/school-calendar-*.js'
      - 'frontend/src/screens/shared/team-calendar-*.js'
      - 'supabase/migrations/20260802190000_add_team_calendar_events.sql'
      - 'tests/team-calendar-ui.test.mjs'
      - 'tests/school-calendar-logic.test.mjs'
      - 'e2e/tests/12-calendar-layers.spec.mjs'
      - '.github/workflows/validate-calendar-layers.yml'

permissions:
  contents: read

jobs:
  calendar-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: Check focused calendar code
        run: |
          node --check frontend/src/team-calendar-runtime.js
          node --check frontend/src/screens/shared/team-calendar-data.js
          node --check frontend/src/screens/shared/team-calendar-ui.js
          node --check e2e/tests/12-calendar-layers.spec.mjs
          node --test tests/team-calendar-ui.test.mjs tests/school-calendar-logic.test.mjs tests/month-calendar-session.test.mjs
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Build production bundle
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Run direct calendar layer scenario
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
        run: npx playwright test -c e2e/playwright.config.mjs e2e/tests/12-calendar-layers.spec.mjs --project=chromium
      - name: Check PWA guardrails
        run: npm run check:pwa
      - name: Upload calendar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-layers-evidence-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
