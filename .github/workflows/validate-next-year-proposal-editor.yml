name: Validate next-year proposal editor

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/proposal-next-year-editor-stability.js'
      - 'frontend/src/proposal-next-year-selection-hydration.js'
      - 'frontend/src/proposal-next-year-pricing-display.js'
      - 'frontend/src/proposal-next-year-workshops.js'
      - 'frontend/src/proposal-editor-compact-fixes.js'
      - 'frontend/src/feature-loaders.js'
      - 'frontend/src/config.js'
      - 'frontend/sw.js'
      - 'tests/proposal-next-year-editor-stability.test.mjs'
      - 'tests/proposal-next-year-selection-hydration.test.mjs'
      - 'tests/proposal-editor-compact-fixes.test.mjs'
      - 'e2e/tests/09-proposal-focused-regressions.spec.mjs'
      - '.github/workflows/validate-next-year-proposal-editor.yml'
  workflow_dispatch:

concurrency:
  group: validate-next-year-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-next-year-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check focused JavaScript syntax
        run: |
          node --check frontend/src/proposal-next-year-editor-stability.js
          node --check frontend/src/proposal-next-year-selection-hydration.js
          node --check frontend/src/proposal-next-year-pricing-display.js
          node --check frontend/src/proposal-editor-compact-fixes.js
          node --check frontend/src/feature-loaders.js
          node --check tests/proposal-next-year-editor-stability.test.mjs
          node --check tests/proposal-next-year-selection-hydration.test.mjs
          node --check tests/proposal-editor-compact-fixes.test.mjs
          node --check e2e/tests/09-proposal-focused-regressions.spec.mjs

      - name: Run focused next-year editor tests
        run: node --test tests/proposal-next-year-editor-stability.test.mjs tests/proposal-next-year-selection-hydration.test.mjs tests/proposal-editor-compact-fixes.test.mjs tests/proposal-next-year-workshops.test.mjs tests/proposal-next-year-pricing-display.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build production bundle
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run focused workshop-only browser test
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
        run: |
          timeout --signal=TERM --kill-after=15s 3m \
            npx playwright test -c e2e/playwright.config.mjs e2e/tests/09-proposal-focused-regressions.spec.mjs \
            --project=chromium \
            --grep "a workshop-only next-year proposal prices, totals and previews correctly with nothing else on the form" \
            --retries=0

      - name: Check PWA cache guardrails
        run: npm run check:pwa

      - name: Upload focused proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-year-proposal-editor-evidence-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
