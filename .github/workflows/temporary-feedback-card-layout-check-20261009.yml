name: Temporary feedback template card layout validation
on:
  push:
    branches:
      - fix/feedback-template-cards-wider-centered-20261009
jobs:
  feedback-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check feedback UI and PDF contracts
        run: node --test tests/impact-feedback-paper-pdf.test.mjs
      - name: Verify frontend build
        run: npm run build
