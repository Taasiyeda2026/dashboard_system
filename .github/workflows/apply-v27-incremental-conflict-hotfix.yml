name: Apply v27 scheduling hotfix

on:
  push:
    branches:
      - fix/v27-incremental-compaction-and-school-conflict-repair
    paths:
      - scripts/apply_v27_incremental_conflict_hotfix.py
      - .github/workflows/apply-v27-incremental-conflict-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/v27-incremental-compaction-and-school-conflict-repair
          fetch-depth: 0
      - name: Apply targeted source changes
        run: python scripts/apply_v27_incremental_conflict_hotfix.py
      - name: Validate focused scheduling behavior
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check frontend/src/screens/course-scheduling-planning.js
          node --test tests/course-scheduling-school-packing-option-coverage.test.mjs
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v27_incremental_conflict_hotfix.py .github/workflows/apply-v27-incremental-conflict-hotfix.yml
          git add frontend/src/screens/course-scheduling-planning.js tests/course-scheduling-school-packing-option-coverage.test.mjs frontend/sw.js index.html
          git commit -m "Planning v27: localize compaction and resolve impossible staff bundles"
          git push origin HEAD:fix/v27-incremental-compaction-and-school-conflict-repair
