name: Apply exception district normalization

on:
  push:
    branches:
      - fix/canonical-exception-districts-20260802

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-exception-districts-20260802
          fetch-depth: 0

      - name: Apply focused source patch
        run: node scripts/apply_exception_district_normalization.mjs

      - name: Verify syntax
        run: node --check frontend/src/screens/exceptions.js

      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/exceptions.js scripts/apply_exception_district_normalization.mjs .github/workflows/apply-exception-district-normalization.yml
          git commit -m "Normalize exception district labels and order"
          git push origin HEAD:fix/canonical-exception-districts-20260802
