name: Validate unified client file

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/screens/proposals-agreements.js'
      - 'frontend/src/screens/instructors.js'
      - 'frontend/src/screens/instructor-matching-engine.js'
      - 'frontend/src/screens/instructor-scheduling-workflow.js'
      - 'frontend/src/screens/course-scheduling*.js'
      - 'frontend/src/screens/shared/activity-scheduling-eligibility.js'
      - 'frontend/src/screens/instructor-contacts.js'
      - 'frontend/src/screens/operations-inventory-polish.js'
      - 'frontend/src/proposal-pdf-svg-origin-clean.js'
      - 'frontend/src/proposal-pdf-storage-key.js'
      - 'frontend/src/proposal-pdf-storage-key-hotfix.js'
      - 'frontend/src/proposal-activity-linking.js'
      - 'frontend/src/proposal-next-year-pricing-display.js'
      - 'frontend/src/proposal-next-year-workshops.js'
      - 'frontend/src/activity-drawer-inline-layout.js'
      - 'frontend/src/activity-drawer-type-layout-fix.js'
      - 'frontend/src/admin-permissions-access-hotfix.js'
      - 'frontend/src/auth-session-isolation-hotfix.js'
      - 'frontend/src/session-security-policy.js'
      - 'frontend/src/session-security-runtime.js'
      - 'frontend/src/main-with-proposal-pdf-hotfix.js'
      - 'frontend/src/state.js'
      - 'frontend/src/supabase-client.js'
      - 'frontend/src/dashboard-kpi-corrections.js'
      - 'frontend/src/summer-feedback-admin-integration.js'
      - 'frontend/src/summer-feedback-instructor-card.js'
      - 'frontend/public/summer-feedback/**'
      - 'frontend/src/styles/**'
      - 'frontend/src/config.js'
      - 'frontend/sw.js'
      - 'sw.js'
      - 'index.html'
      - 'supabase/migrations/*proposal_activity*.sql'
      - 'supabase/migrations/*next_year*.sql'
      - 'supabase/migrations/*course_scheduling*.sql'
      - 'tests/auth-session-admin-lists-hotfix.test.mjs'
      - 'tests/session-security-policy.test.mjs'
      - 'tests/client-file-*.test.mjs'
      - 'tests/proposal-pdf-svg-origin-clean.test.mjs'
      - 'tests/proposal-pdf-storage-key-hotfix.test.mjs'
      - 'tests/proposal-activity-linking.test.mjs'
      - 'tests/proposal-next-year-pricing-display.test.mjs'
      - 'tests/proposal-next-year-workshops.test.mjs'
      - 'tests/activity-drawer-inline-layout.test.mjs'
      - 'tests/activity-drawer-type-layout-fix.test.mjs'
      - 'tests/proposals-agreements-screen.test.mjs'
      - 'tests/instructor-contacts-nav-access.test.mjs'
      - 'tests/instructor-contacts-screen.test.mjs'
      - 'tests/instructor-matching-engine.test.mjs'
      - 'tests/instructor-scheduling-permissions.test.mjs'
      - 'tests/course-scheduling-*.test.mjs'
      - 'tests/summer-feedback-admin-personal-reports.test.mjs'
      - 'tests/summer-feedback-admin-response-view.test.mjs'
      - 'tests/summer-feedback-completion-overview.test.mjs'
      - 'tests/summer-feedback-instructor-card.test.mjs'
      - 'tests/summer-feedback-refinements.test.mjs'
      - '.github/workflows/validate-client-file-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check frontend/src/screens/proposals-agreements.js
          node --check frontend/src/screens/instructors.js
          node --check frontend/src/screens/instructor-matching-engine.js
          node --check frontend/src/screens/course-scheduling-engine.js
          node --check frontend/src/screens/course-scheduling-travel.js
          node --check frontend/src/screens/course-scheduling.js
          node --check frontend/src/screens/shared/activity-scheduling-eligibility.js
          node --check frontend/src/screens/instructor-contacts.js
          node --check frontend/src/screens/operations-inventory-polish.js
          node --check frontend/src/proposal-pdf-svg-origin-clean.js
          node --check frontend/src/proposal-pdf-storage-key.js
          node --check frontend/src/proposal-pdf-storage-key-hotfix.js
          node --check frontend/src/proposal-activity-linking.js
          node --check frontend/src/proposal-next-year-pricing-display.js
          node --check frontend/src/proposal-next-year-workshops.js
          node --check frontend/src/activity-drawer-inline-layout.js
          node --check frontend/src/activity-drawer-type-layout-fix.js
          node --check frontend/src/admin-permissions-access-hotfix.js
          node --check frontend/src/auth-session-isolation-hotfix.js
          node --check frontend/src/session-security-policy.js
          node --check frontend/src/session-security-runtime.js
          node --check frontend/src/main-with-proposal-pdf-hotfix.js
          node --check frontend/src/supabase-client.js
          node --check frontend/src/dashboard-kpi-corrections.js
          node --check frontend/src/summer-feedback-admin-integration.js
          node --check frontend/src/summer-feedback-instructor-card.js
          node --check frontend/public/summer-feedback/app.js
          node --check frontend/public/summer-feedback/questionnaire-refinements.js
          node --check frontend/public/summer-feedback/embedded-admin.js
          node --check frontend/public/summer-feedback/supabase-configured-client.js
          node --check frontend/public/summer-feedback/completion-overview.js
          node --check frontend/public/summer-feedback/admin-response-view.js
          node --check frontend/src/main.js
          node --check frontend/src/state.js
          node --check frontend/src/api.js
          node --check tests/auth-session-admin-lists-hotfix.test.mjs
          node --check tests/session-security-policy.test.mjs
          node --check tests/client-file-unified-screen.test.mjs
          node --check tests/client-file-version-sync.test.mjs
          node --check tests/instructor-contacts-nav-access.test.mjs
          node --check tests/instructor-contacts-screen.test.mjs
          node --check tests/proposal-pdf-svg-origin-clean.test.mjs
          node --check tests/proposal-pdf-storage-key-hotfix.test.mjs
          node --check tests/proposal-activity-linking.test.mjs
          node --check tests/proposal-next-year-pricing-display.test.mjs
          node --check tests/proposal-next-year-workshops.test.mjs
          node --check tests/activity-drawer-inline-layout.test.mjs
          node --check tests/activity-drawer-type-layout-fix.test.mjs
          node --check tests/course-scheduling-engine.test.mjs
          node --check tests/course-scheduling-migration.test.mjs
          node --check tests/summer-feedback-admin-personal-reports.test.mjs
          node --check tests/summer-feedback-admin-response-view.test.mjs
          node --check tests/summer-feedback-completion-overview.test.mjs
          node --check tests/summer-feedback-instructor-card.test.mjs
          node --check tests/summer-feedback-refinements.test.mjs

      - name: Run auth and shared-list regression tests
        run: node --test tests/auth-session-admin-lists-hotfix.test.mjs

      - name: Run session security timeout tests
        run: node --test tests/session-security-policy.test.mjs

      - name: Check summer feedback dashboard loading
        run: node --test --test-name-pattern='dashboard loads' tests/summer-feedback-admin-personal-reports.test.mjs

      - name: Check summer feedback admin restriction
        run: node --test --test-name-pattern='restricted to' tests/summer-feedback-admin-personal-reports.test.mjs

      - name: Check summer feedback personal reports integration
        run: node --test --test-name-pattern='personal reports keeps' tests/summer-feedback-admin-personal-reports.test.mjs

      - name: Check summer feedback configured Supabase project
        run: node --test --test-name-pattern='shares dashboard Supabase configuration' tests/summer-feedback-admin-personal-reports.test.mjs

      - name: Check summer feedback embedded mode
        run: node --test --test-name-pattern='embedded management mode' tests/summer-feedback-admin-personal-reports.test.mjs

      - name: Check summer feedback saved response viewer
        run: node --test tests/summer-feedback-admin-response-view.test.mjs

      - name: Check summer feedback questionnaire v4
        run: node --test tests/summer-feedback-refinements.test.mjs

      - name: Check summer feedback completion overview
        run: node --test tests/summer-feedback-completion-overview.test.mjs

      - name: Check assigned instructor summer feedback card
        run: node --test tests/summer-feedback-instructor-card.test.mjs

      - name: Check proposal activity creation
        run: node --test tests/proposal-activity-linking.test.mjs

      - name: Check next-year proposal pricing display
        run: node --test tests/proposal-next-year-pricing-display.test.mjs

      - name: Check next-year workshops in proposals
        run: node --test tests/proposal-next-year-workshops.test.mjs

      - name: Check activity drawer inline layout
        run: node --test tests/activity-drawer-inline-layout.test.mjs

      - name: Check activity drawer type layouts and archive actions
        run: node --test tests/activity-drawer-type-layout-fix.test.mjs

      - name: Run unified client file tests
        run: >-
          node --test
          --test-name-pattern='client|contact|combined|view-only|proposal|semantic|archive|כל ההצעות|opening|STATUS_LABELS|instructors|home board|all-proposals|routine debug'
          tests/client-file-unified-screen.test.mjs

      - name: Validate current cache and hotfix versions
        run: node --test tests/client-file-version-sync.test.mjs

      - name: Run proposal PDF SVG origin-clean tests
        run: node --test tests/proposal-pdf-svg-origin-clean.test.mjs

      - name: Run proposal PDF storage-key tests
        run: node --test tests/proposal-pdf-storage-key-hotfix.test.mjs

      - name: Run instructor contacts navigation tests
        run: node --test tests/instructor-contacts-nav-access.test.mjs

      - name: Run instructor contacts screen tests
        run: node --test tests/instructor-contacts-screen.test.mjs

      - name: Run operational instructor scheduling tests
        run: node --test tests/instructor-matching-engine.test.mjs tests/instructor-scheduling-permissions.test.mjs tests/course-scheduling-engine.test.mjs tests/course-scheduling-migration.test.mjs

      - name: Build production bundle
        run: npm run check:build

      - name: Check PWA cache guardrails
        run: npm run check:pwa
