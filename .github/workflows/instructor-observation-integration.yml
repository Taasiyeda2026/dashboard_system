name: Instructor Observation Integration
on:
  pull_request:
    paths:
      - 'frontend/src/instructor-observation-runtime.js'
      - 'frontend/src/styles/instructor-observation.css'
      - 'frontend/src/main.js'
      - 'supabase/migrations/20261019023000_instructor_observations.sql'
      - 'tests/instructor-observation-source.test.mjs'
      - 'tests/instructor-observation-browser.test.mjs'
      - 'tests/instructor-observation-postgres.test.mjs'
      - '.github/workflows/instructor-observation-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-contract-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check observation runtime and validations
        run: node --test tests/instructor-observation-source.test.mjs tests/instructor-observation-browser.test.mjs
      - name: Parse observation PostgreSQL migration with pglast
        run: |
          python3 -m pip install --quiet pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          sql = Path('supabase/migrations/20261019023000_instructor_observations.sql').read_text()
          statements = parse_sql(sql)
          assert len(statements) >= 15, f'Unexpected SQL statement count: {len(statements)}'
          print(f'Parsed {len(statements)} observation migration statements')
          PY
  observation-postgres-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: observation_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL RLS and completed observation integrity
        env:
          OBSERVATION_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/observation_fixture
        run: node --test tests/instructor-observation-postgres.test.mjs
