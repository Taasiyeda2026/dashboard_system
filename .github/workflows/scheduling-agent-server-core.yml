name: Scheduling Agent Server Core
on:
  pull_request:
    paths:
      - 'services/scheduling-agent/**'
      - 'tests/scheduling-agent-server-*.test.mjs'
      - 'tests/scheduling-agent-github-adapter.test.mjs'
      - 'tests/scheduling-agent-github-server-security.test.mjs'
      - 'tests/scheduling-agent-shadow-readonly.test.mjs'
      - 'tests/scheduling-agent-snapshot-views.test.mjs'
      - 'tests/scheduling-agent-route-cache-shadow.test.mjs'
      - 'tests/scheduling-agent-school-address-scope.test.mjs'
      - 'supabase/migrations/20261015184000_scheduling_agent_worker_least_privilege_views.sql'
      - 'supabase/migrations/20261015181500_scheduling_agent_worker_readonly_shadow.sql'
      - 'supabase/functions/scheduling-agent-worker-api/**'
      - 'supabase/migrations/20261015170000_scheduling_agent_worker_oidc_control.sql'
      - '.github/workflows/scheduling-agent-worker.yml'
      - '.github/workflows/scheduling-agent-server-core.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/scheduling-agent-server-*.test.mjs tests/scheduling-agent-github-*.test.mjs tests/scheduling-agent-shadow-readonly.test.mjs tests/scheduling-agent-snapshot-views.test.mjs tests/scheduling-agent-route-cache-shadow.test.mjs tests/scheduling-agent-school-address-scope.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/scheduling-agent-worker-api/index.ts
      - run: python -m pip install --disable-pip-version-check --quiet pglast
      - run: python -c "from pglast import parse_sql; parse_sql(open('supabase/migrations/20261015170000_scheduling_agent_worker_oidc_control.sql').read()); print('SQL syntax verified')"
      - run: python -c "from pglast import parse_sql; parse_sql(open('supabase/migrations/20261015181500_scheduling_agent_worker_readonly_shadow.sql').read()); print('Shadow SQL syntax verified')"
      - run: python -c "from pglast import parse_sql; parse_sql(open('supabase/migrations/20261015184000_scheduling_agent_worker_least_privilege_views.sql').read()); print('View SQL syntax verified')"
