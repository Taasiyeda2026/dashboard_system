name: Scheduling Agent Server Core
on:
  pull_request:
    paths:
      - 'services/scheduling-agent/**'
      - 'tests/scheduling-agent-server-*.test.mjs'
      - 'tests/scheduling-agent-github-adapter.test.mjs'
      - '.github/workflows/scheduling-agent-worker.yml'
      - '.github/workflows/scheduling-agent-server-core.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/scheduling-agent-server-*.test.mjs tests/scheduling-agent-github-adapter.test.mjs
