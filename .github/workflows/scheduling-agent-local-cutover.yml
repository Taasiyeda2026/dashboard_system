name: Scheduling Local Engine Cutover
on:
  pull_request:
    paths:
      - 'frontend/src/screens/course-scheduling.js'
      - 'tests/scheduling-agent-local-calculation-cutover.test.mjs'
      - 'tests/scheduling-dashboard-agent-controls.test.mjs'
      - 'frontend/src/screens/course-scheduling-agent-selection.js'
      - '.github/workflows/scheduling-agent-local-cutover.yml'
  workflow_dispatch:
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/scheduling-agent-local-calculation-cutover.test.mjs
      - name: Verify direct manual assignment and all guarded replacement flows
        run: node --test tests/scheduling-dashboard-agent-controls.test.mjs
      - name: Verify manual controls in the main workboard
        run: >-
          node --test
          --test-name-pattern="single-course manual controls"
          tests/course-scheduling-district-simulation.test.mjs

  manual-server-validation:
    if: github.event_name == 'workflow_dispatch'
    name: manual operations isolated server validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard_manual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_manual_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate operator gateway on disposable PostgreSQL
        env:
          SCHEDULING_MANUAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dashboard_manual_test
        run: node --test tests/scheduling-manual-operations-postgres.test.mjs
      - name: Build paired manual interface
        run: npm run build
      - name: Validate service worker cache boundary
        run: node --test tests/service-worker-pwa-cache.test.mjs
      - name: Generate migration with verified Supabase CLI
        run: |
          npx --yes supabase@2.121.0 --help
          npx --yes supabase@2.121.0 migration --help
          npx --yes supabase@2.121.0 migration new operator_manual_scheduling
          node --input-type=module -e "
          import fs from 'node:fs';
          const name = fs.readdirSync('supabase/migrations').filter(n => n.endsWith('_operator_manual_scheduling.sql')).sort().at(-1);
          if (!name) throw Error('generated_migration_missing');
          const path = 'supabase/migrations/' + name;
          fs.copyFileSync('services/scheduling-agent/manual-operations.sql', path);
          console.log('GENERATED_MIGRATION=' + path);
          "
