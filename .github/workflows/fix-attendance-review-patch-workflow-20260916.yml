name: Fix attendance review patch workflow 20260916

on:
  push:
    branches:
      - codex/redesign-attendance-control-review-20260916

permissions:
  contents: write

jobs:
  fix-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-attendance-control-review-20260916
      - name: Patch main workflow regression update
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/patch-attendance-review-ui-20260916.yml')
          text = p.read_text(encoding='utf-8')
          anchor = "          ''', encoding='utf-8')\n      - run: npm ci\n"
          insert = """          ''', encoding='utf-8')

          legacy_path = Path('tests/attendance-validation-record-km.test.mjs')
          legacy = legacy_path.read_text(encoding='utf-8')
          old_legacy = "assert.match(html, /ביטול זמן: 1:45/);"
          new_legacy = "assert.match(html, /בדיקת ביטול זמן/);\\n  assert.match(html, /<th>זמן ביטול<\\/th>/);"
          if old_legacy not in legacy:
              raise SystemExit('legacy cancellation assertion anchor missing')
          legacy_path.write_text(legacy.replace(old_legacy, new_legacy, 1), encoding='utf-8')
      - run: npm ci
"""
          if 'legacy_path = Path' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'workflow insertion anchor count={text.count(anchor)}')
              text = text.replace(anchor, insert, 1)
          old_add = "git add frontend/src/screens/attendance-control.js tests/attendance-control-review-ui.test.mjs"
          new_add = "git add frontend/src/screens/attendance-control.js tests/attendance-control-review-ui.test.mjs tests/attendance-validation-record-km.test.mjs"
          if old_add in text:
              text = text.replace(old_add, new_add, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-attendance-review-ui-20260916.yml
          git diff --cached --quiet || git commit -m "Fix attendance review regression update"
          git push origin HEAD:codex/redesign-attendance-control-review-20260916
