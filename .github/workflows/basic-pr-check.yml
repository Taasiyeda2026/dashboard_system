name: Basic PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: basic-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basic:
    name: basic changed-file validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files only
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Always compare with the current target branch, not the PR's historical base SHA.
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"

          # Fast whitespace / malformed-patch sanity check.
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          js_count=0
          json_count=0

          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue

            case "$file" in
              *.js|*.mjs|*.cjs)
                node --check "$file"
                js_count=$((js_count + 1))
                ;;
              *.json)
                node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
                json_count=$((json_count + 1))
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")

          echo "Checked ${js_count} changed JavaScript files and ${json_count} changed JSON files."


      - name: Run mobile interface contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/styles/instructor-|frontend/src/screens/instructor-portal/|attendance/(index\.html|sw\.js|src/styles/)|tests/(instructor-responsive-ux|attendance-mobile-contract)\.test\.mjs)'; then
            node --test \
              tests/instructor-responsive-ux.test.mjs \
              tests/attendance-mobile-contract.test.mjs
          else
            echo "No instructor/attendance mobile contract files changed; mobile tests skipped."
          fi

      - name: Run focused scheduling contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/screens/(course-scheduling|instructor-matching-engine)|frontend/src/screens/shared/(activity-scheduling-eligibility|course-scheduling-manual-picker-access)|supabase/migrations/.*schedul|tests/course-scheduling)'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test \
              tests/course-scheduling-stage3-optimization.test.mjs \
              tests/course-scheduling-contract-restoration.test.mjs \
              tests/course-scheduling-date-adjustments.test.mjs \
              tests/course-scheduling-stage2-matching.test.mjs \
              tests/course-scheduling-engine.test.mjs \
              tests/course-scheduling-hidden-planning-state.test.mjs \
              tests/course-scheduling-e2e-alignment.test.mjs \
              tests/course-scheduling-district-plan-consistency.test.mjs \
              tests/course-scheduling-district-simulation.test.mjs \
              tests/course-scheduling-district-simulation-save-drafts.test.mjs \
              tests/course-scheduling-logic-ui-corrections.test.mjs \
              tests/course-scheduling-manual-finalize-soft-warnings.test.mjs
          else
            echo "No scheduling contract files changed; focused scheduling tests skipped."
          fi
