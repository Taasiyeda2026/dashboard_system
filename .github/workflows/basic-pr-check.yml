name: Basic PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: basic-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  basic:
    name: basic changed-file validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files only
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Always compare with the current target branch, not the PR's historical base SHA.
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"

          # Fast whitespace / malformed-patch sanity check.
          git diff --check "$BASE_SHA" "$HEAD_SHA"

          js_count=0
          json_count=0

          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue

            case "$file" in
              *.js|*.mjs|*.cjs)
                node --check "$file"
                js_count=$((js_count + 1))
                ;;
              *.json)
                node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
                json_count=$((json_count + 1))
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA")

          echo "Checked ${js_count} changed JavaScript files and ${json_count} changed JSON files."

      - name: Run finance manual-selection regression tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/screens/(finance|finance-manual-account)[.]js|tests/(finance-screen|finance-manual-account)[.]test[.]mjs)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^supabase/(migrations/20261016223000_route_location_identity_audit[.]sql|functions/scheduling-route/index[.]ts)$'; then
            python3 -m pip install --quiet pglast
            python3 -c "from pglast import parse_sql; from pathlib import Path; parse_sql(Path('supabase/migrations/20261016223000_route_location_identity_audit.sql').read_text(encoding='utf-8')); print('SQL parsed')"
            # The legacy Edge module has unrelated pre-existing Supabase generic typing
            # errors; SQL syntax, focused runtime tests and deployment validate this patch.
          fi

      - name: Validate route school location migration SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pglast
          python3 -c "from pglast import parse_sql; from pathlib import Path; p=Path('supabase/migrations/20261016235000_manual_school_route_location_review.sql'); parse_sql(p.read_text(encoding='utf-8')); print('Manual school route review SQL: valid')"

      - name: Validate mixed location review migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pglast
          python3 -c "from pglast import parse_sql; from pathlib import Path; paths=['supabase/migrations/20261016235800_route_review_instructor_endpoints.sql','supabase/migrations/20261016235820_route_review_mixed_completion.sql','supabase/migrations/20261016235840_school_review_endpoint_type.sql']; [parse_sql(Path(x).read_text(encoding='utf-8')) for x in paths]; print('Mixed route migrations syntax: OK')"

      - name: Protect production Supabase Auth configuration
        run: node scripts/ci/guard-supabase-production-auth.mjs

      - name: Run proposal program display regression tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/(screens/proposals-agreements[.]js|proposal-(program-display|next-year-pricing-display|workflow-completion)[.]js)|tests/(proposal-program-display[.]test[.]mjs|fixtures/proposal-program-display[.]mjs))$'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/proposal-program-display.test.mjs
            npx playwright install --with-deps chromium
            CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')" RUN_PROPOSAL_DISPLAY_BROWSER=1 node --test tests/proposal-program-display-browser.test.mjs
          else
            echo "No proposal-display changes; focused tests skipped."
          fi

      - name: Run client file external layout and PDF upload checks
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/(screens/(proposals-agreements|client-file-layout-polish)[.]js|client-file-external-documents[.]js)|tests/client-file-external-documents[.]test[.]mjs)$'; then
            node --test tests/client-file-external-documents.test.mjs
          else
            echo "No client file external document changes; focused tests skipped."
          fi

      - name: Verify new-activity tour location visibility
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/screens/activities[.]js|tests/activities-screen[.]test[.]mjs)$'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test --test-name-pattern="activity add form refreshes activity_name options" tests/activities-screen.test.mjs
          else
            echo "No new-activity tour-location changes."
          fi

      - name: Run photo consent contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/screens/(photo-consent-workspace[.]js|activities[.]js|shared/(activity-detail-html|activity-photo-consent-(drawer|viewer)|photo-consent-(school|client|completion))[.]js)|frontend/src/styles/activity-drawer-inline-layout[.]css|frontend/src/screens/instructor-portal/activity-drawer[.]js|supabase/functions/photo-consent-sharepoint/index[.]ts|tests/photo-consent-(mobile-school-view|visibility-contract|completed-compact|drawer-upload|camera-saved-status|view-and-operational-columns|compact-header|clean-documents-and-camera-alignment|instructor-own-activity)[.]test[.]mjs)$'; then
            node --test tests/photo-consent-mobile-school-view.test.mjs tests/photo-consent-visibility-contract.test.mjs tests/photo-consent-completed-compact.test.mjs tests/photo-consent-drawer-upload.test.mjs tests/photo-consent-camera-saved-status.test.mjs tests/photo-consent-view-and-operational-columns.test.mjs tests/photo-consent-compact-header.test.mjs tests/photo-consent-clean-documents-and-camera-alignment.test.mjs tests/photo-consent-instructor-own-activity.test.mjs
          else
            echo "No photo-consent changes; focused tests skipped."
          fi

      - name: Run impact feedback UI and analytics contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/(screens/impact-feedback\\.js|impact-feedback/)|supabase/(migrations/.*feedback|functions/feedback-staff-automation/)|tests/(impact-feedback-|feedback-staff-automation-|feedback-staff-delivery))'; then
            # This suite always includes instructor-review tests, which require jsdom.
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/impact-feedback-domain.test.mjs tests/impact-feedback-analysis.test.mjs tests/impact-feedback-ui-contract.test.mjs tests/impact-feedback-instructor-review.test.mjs tests/impact-feedback-conditional-questions.test.mjs tests/feedback-staff-automation-dryrun.test.mjs tests/feedback-staff-delivery.test.mjs tests/impact-feedback-instructor-portal-dates-pdf.test.mjs tests/impact-feedback-instructor-access.test.mjs tests/impact-feedback-elementary-pdf-only.test.mjs tests/instructor-reports-hidden-cache-and-pdf.test.mjs tests/instructor-portal.test.mjs tests/instructor-responsive-ux.test.mjs tests/attendance-mobile-contract.test.mjs
          else
            echo "No feedback files changed; focused tests skipped."
          fi

      - name: Run mobile interface contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/styles/instructor-|frontend/src/screens/instructor-portal/|attendance/(index\.html|sw\.js|src/styles/)|tests/(instructor-responsive-ux|attendance-mobile-contract)\.test\.mjs)'; then
            node --test \
              tests/instructor-responsive-ux.test.mjs \
              tests/attendance-mobile-contract.test.mjs
          else
            echo "No instructor/attendance mobile contract files changed; mobile tests skipped."
          fi

      - name: Run attendance training picker contract
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(attendance/(index\.html|sw\.js|src/(training-report-ui-runtime|course-dashboard-choice-runtime)\.js|src/components/searchable-select\.js|src/services/(activities|activities-report\.helpers)\.service\.js|src/services/activities-report\.helpers\.js)|supabase/migrations/.*attendance_dashboard_course_choice|tests/attendance-(new-report-activities|activity-type-behavior|time-cancellation-online-training|travel-compensation)\.test\.mjs)$'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test \
              tests/attendance-new-report-activities.test.mjs \
              tests/attendance-activity-type-behavior.test.mjs \
              tests/attendance-time-cancellation-online-training.test.mjs \
              tests/attendance-travel-compensation.test.mjs \
              tests/attendance-inline-cancellation.test.mjs \
              tests/attendance-unified-travel-review.test.mjs \
              tests/attendance-monthly-report-summary.test.mjs \
              tests/attendance-core-flow-hardening.test.mjs
          else
            echo "No attendance training-picker contract files changed; focused tests skipped."
          fi

      - name: Run work schedule manager-instructor parity contract
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/activity-2027-contact-list-runtime\.js|frontend/src/screens/operations-management\.js|frontend/src/screens/instructor-portal/(work-schedule|portal-data)\.js|frontend/src/screens/shared/instructor-course-schedule-(2027|print|view)\.js|tests/work-schedule-manager-instructor-parity\.test\.mjs)$'; then
            node --test tests/work-schedule-manager-instructor-parity.test.mjs
          else
            echo "No work-schedule parity files changed; parity test skipped."
          fi

      - name: Run activity status save regression tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/api\.js|tests/activity-status-only-save\.test\.mjs)$'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/activity-status-only-save.test.mjs
          else
            echo "No activity status-save contract files changed; focused test skipped."
          fi

      - name: Run focused scheduling contract tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/src/screens/(course-scheduling|instructor-matching-engine|scheduling-core/)|frontend/src/screens/shared/(activity-scheduling-eligibility|course-scheduling-manual-picker-access|scheduling-weekend-policy)|supabase/migrations/.*schedul|tests/(course-scheduling|scheduling-new-core|scheduling-point-worker-regression|scheduling-v37-course-only-validator))'; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test \
              tests/scheduling-new-core.test.mjs \
              tests/scheduling-undated-week-lead.test.mjs \
              tests/course-scheduling-stage3-optimization.test.mjs \
              tests/course-scheduling-contract-restoration.test.mjs \
              tests/course-scheduling-date-adjustments.test.mjs \
              tests/course-scheduling-stage2-matching.test.mjs \
              tests/course-scheduling-engine.test.mjs \
              tests/course-scheduling-hidden-planning-state.test.mjs \
              tests/course-scheduling-e2e-alignment.test.mjs \
              tests/course-scheduling-district-plan-consistency.test.mjs \
              tests/course-scheduling-district-simulation.test.mjs \
              tests/course-scheduling-district-simulation-save-drafts.test.mjs \
              tests/course-scheduling-logic-ui-corrections.test.mjs \
              tests/course-scheduling-manual-finalize-soft-warnings.test.mjs \
              tests/course-scheduling-transition-server-rules.test.mjs \
              tests/course-meeting-substitute-permissions.test.mjs \
              tests/course-scheduling-planning-tab.test.mjs \
              tests/course-scheduling-current-plan-report.test.mjs \
              tests/course-scheduling-semester-planning-report.test.mjs \
              tests/course-scheduling-school-name-order.test.mjs \
              tests/course-scheduling-planning-invalidate.test.mjs \
              tests/course-scheduling-planning-self-invalidation.test.mjs \
              tests/course-scheduling-day-consolidation-netanya.test.mjs \
              tests/course-scheduling-checkpoint-resume-rebase.test.mjs \
              tests/scheduling-planning-audit-sector-filter.test.mjs \
              tests/scheduling-point-worker-regression.test.mjs \
              tests/scheduling-v37-course-only-validator.test.mjs \
              tests/course-scheduling-distance-update.test.mjs \
              tests/scheduling-route-manual-missing-queue.test.mjs \
              tests/course-scheduling-maintenance-design.test.mjs \
              tests/scheduling-route-location-identity-audit.test.mjs \
              tests/scheduling-route-review-school-location.test.mjs \
              tests/scheduling-route-instructor-home-review.test.mjs
          else
            echo "No scheduling contract files changed; focused scheduling tests skipped."
          fi

  scheduling-postgres:
    name: scheduling Postgres regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run planning invalidation against PostgreSQL
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/course-scheduling-planning-invalidation-postgres.test.mjs
      # Runs after the step above, never in parallel: both rebuild the public schema.
      - name: Run precise planning invalidation against PostgreSQL 16
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
          PLANNING_INVALIDATION_REQUIRE_DB: '1'
        run: node --test tests/planning-precise-invalidation-postgres.test.mjs
      # Execute the production commit function on disposable PostgreSQL,
      # never on the user's actual Supabase database.
      - name: Exercise validated planning checkpoint commit against PostgreSQL 16
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
          PLANNING_INVALIDATION_REQUIRE_DB: '1'
        run: node --test tests/course-scheduling-checkpoint-commit-postgres.test.mjs

      - name: Verify two-course incremental planning canary with protected assignments
        run: node --test tests/scheduling-agent-small-safe-canary.test.mjs
      # Admission has its own disposable database; never tests against production.
      - name: Verify safe automatic scheduling admission against isolated PostgreSQL
        env:
          SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/scheduling-agent-durable-postgres.test.mjs

      - name: Verify fourteen-day scheduling guard in isolated PostgreSQL
        env:
          SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/scheduling-undated-fortnight-postgres.test.mjs

      # Staff-feedback tests rebuild their own disposable Postgres schema.
      # Run after the planning checks, never in parallel on the same database.
      - name: Test staff feedback 20 November completion against PostgreSQL 16
        env:
          STAFF_DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/feedback-staff-delivery-postgres.test.mjs
      - name: Verify finance PDF dispatch and read-only grants
        run: node --test tests/finance-billing-edge.test.mjs tests/finance-pdf-dispatch-grants.test.mjs
      - name: Verify invoice recipient mapping and email privacy
        run: node --test tests/finance-invoice-recipients.test.mjs tests/finance-transaction-issuance.test.mjs
      - name: Verify billing administrator role in client file
        run: node --test tests/client-file-invoice-recipient.test.mjs
; then
            npm ci --ignore-scripts --no-audit --no-fund
            node --test tests/finance-manual-account.test.mjs tests/finance-screen.test.mjs
          else
            echo "No finance manual-selection changes; focused tests skipped."
          fi

      - name: Validate quarantined route SQL and Edge TypeScript
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^supabase/(migrations/20261016223000_route_location_identity_audit[.]sql|functions/scheduling-route/index[.]ts)$'; then
            python3 -m pip install --quiet pglast
            python3 -c "from pglast import parse_sql; from pathlib import Path; parse_sql(Path('supabase/migrations/20261016223000_route_location_identity_audit.sql').read_text(encoding='utf-8')); print('SQL parsed')"
            # The legacy Edge module has unrelated pre-existing Supabase generic typing
            # errors; SQL syntax, focused runtime tests and deployment validate this patch.
          fi

      - name: Validate route school location migration SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pglast
          python3 -c "from pglast import parse_sql; from pathlib import Path; p=Path('supabase/migrations/20261016235000_manual_school_route_location_review.sql'); parse_sql(p.read_text(encoding='utf-8')); print('Manual school route review SQL: valid')"

      - name: Validate mixed location review migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pglast
          python3 -c "from pglast import parse_sql; from pathlib import Path; paths=['supabase/migrations/20261016235800_route_review_instructor_endpoints.sql','supabase/migrations/20261016235820_route_review_mixed_completion.sql','supabase/migrations/20261016235840_school_review_endpoint_type.sql']; [parse_sql(Path(x).read_text(encoding='utf-8')) for x in paths]; print('Mixed route migrations syntax: OK')"

      - name: Protect production Supabase Auth configuration
        run: node scripts/ci/guard-supabase-production-auth.mjs

      - name: Run proposal program display regression tests
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
