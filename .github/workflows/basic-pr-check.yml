  scheduling-postgres:
    name: scheduling Postgres regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run planning invalidation against PostgreSQL
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/course-scheduling-planning-invalidation-postgres.test.mjs
      # Runs after the step above, never in parallel: both rebuild the public schema.
      - name: Run precise planning invalidation against PostgreSQL 16
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
          PLANNING_INVALIDATION_REQUIRE_DB: '1'
        run: node --test tests/planning-precise-invalidation-postgres.test.mjs
      # Execute the production commit function on disposable PostgreSQL,
      # never on the user's actual Supabase database.
      - name: Exercise validated planning checkpoint commit against PostgreSQL 16
        env:
          PLANNING_INVALIDATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
          PLANNING_INVALIDATION_REQUIRE_DB: '1'
        run: node --test tests/course-scheduling-checkpoint-commit-postgres.test.mjs

      - name: Verify two-course incremental planning canary with protected assignments
        run: node --test tests/scheduling-agent-small-safe-canary.test.mjs
      # Admission has its own disposable database; never tests against production.
      - name: Verify safe automatic scheduling admission against isolated PostgreSQL
        env:
          SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/scheduling-agent-durable-postgres.test.mjs

      - name: Verify fourteen-day scheduling guard in isolated PostgreSQL
        env:
          SCHEDULING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/scheduling-undated-fortnight-postgres.test.mjs

      # Staff-feedback tests rebuild their own disposable Postgres schema.
      # Run after the planning checks, never in parallel on the same database.
      - name: Test staff feedback 20 November completion against PostgreSQL 16
        env:
          STAFF_DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dashboard_test
        run: node --test tests/feedback-staff-delivery-postgres.test.mjs
      - name: Verify finance PDF dispatch and read-only grants
        run: node --test tests/finance-billing-edge.test.mjs tests/finance-pdf-dispatch-grants.test.mjs
      - name: Verify invoice recipient mapping and email privacy
        run: node --test tests/finance-invoice-recipients.test.mjs tests/finance-transaction-issuance.test.mjs
      - name: Verify billing administrator role in client file
        run: node --test tests/client-file-invoice-recipient.test.mjs
