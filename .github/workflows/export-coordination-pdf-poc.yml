name: Export coordination PDF POC

on:
  push:
    branches:
      - codex/add-full-activity-coordination-process
    paths:
      - '.github/workflows/export-coordination-pdf-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode PDF POC files
        shell: bash
        run: |
          mkdir -p exported-pdfs
          base64 --decode artifacts/activity-coordination-pdf-poc/coordination-single-10-meetings.pdf.b64.txt > exported-pdfs/coordination-single-10-meetings.pdf
          base64 --decode artifacts/activity-coordination-pdf-poc/coordination-school-3-activities.pdf.b64.txt > exported-pdfs/coordination-school-3-activities.pdf
          file exported-pdfs/*.pdf

      - name: Upload PDF POC artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-coordination-pdf-poc
          path: exported-pdfs/*.pdf
          if-no-files-found: error
