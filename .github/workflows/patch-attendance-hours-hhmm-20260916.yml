name: Patch attendance hour display 20260916

on:
  push:
    branches:
      - codex/format-attendance-hours-hhmm-20260916

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/format-attendance-hours-hhmm-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch UI hour formatting
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              if actual == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'attendance/src/components/report-summary-row.js',
              "import { createIcon } from './icon.js';\n",
              "import { createIcon } from './icon.js';\nimport { formatDurationHours } from './monthly-report-summary.js';\n",
              1,
          )
          replace(
              'attendance/src/components/report-summary-row.js',
              "hours.textContent = Number(record.total_hours || 0).toFixed(2);",
              "hours.textContent = formatDurationHours(record.total_hours);",
              1,
          )
          replace(
              'attendance/src/components/report-summary-row.js',
              "return formatTravelMinutes(Number(record?.total_hours || 0) * 60);",
              "return formatDurationHours(record?.total_hours);",
              1,
          )

          replace(
              'attendance/src/screens/my-reports-screen.js',
              "hoursCell.textContent = Number(record.total_hours || 0).toFixed(2);",
              "hoursCell.textContent = formatDurationHours(record.total_hours);",
              1,
          )
          replace(
              'attendance/src/screens/my-reports-screen.js',
              "Number(record.total_hours || 0).toFixed(2) + ' שעות',",
              "formatDurationHours(record.total_hours) + ' שעות',",
              1,
          )

          replace(
              'attendance/src/screens/home-screen.js',
              "import { groupReportRecordsByDate } from '../components/monthly-report-summary.js';",
              "import { groupReportRecordsByDate, formatDurationHours } from '../components/monthly-report-summary.js';",
              1,
          )
          replace(
              'attendance/src/screens/home-screen.js',
              "buildStat(summary.totalHours.toFixed(2),            'שעות',     'clock'),",
              "buildStat(formatDurationHours(summary.totalHours),   'שעות',     'clock'),",
              1,
          )

          replace(
              'attendance/src/screens/new-report-screen.js',
              "import { formatTravelMinutes } from '../components/report-summary-row.js';",
              "import { formatTravelMinutes } from '../components/report-summary-row.js';\nimport { formatDurationHours } from '../components/monthly-report-summary.js';",
              1,
          )
          replace(
              'attendance/src/screens/new-report-screen.js',
              "hoursVal.textContent = h > 0 ? h.toFixed(2) : '—';",
              "hoursVal.textContent = h > 0 ? formatDurationHours(h) : '—';",
              1,
          )

          reference_path = Path('attendance/src/reference-data-layout.js')
          reference = reference_path.read_text(encoding='utf-8')
          anchor = """function numberFrom(value) {
            const normalized = String(value ?? '').replace(/,/g, '').match(/-?\\d+(?:\\.\\d+)?/);
            const number = normalized ? Number(normalized[0]) : 0;
            return Number.isFinite(number) ? number : 0;
          }
          """
          helper = """function numberFrom(value) {
            const normalized = String(value ?? '').replace(/,/g, '').match(/-?\\d+(?:\\.\\d+)?/);
            const number = normalized ? Number(normalized[0]) : 0;
            return Number.isFinite(number) ? number : 0;
          }

          function durationNumberFrom(value) {
            const raw = String(value ?? '').trim();
            const clock = raw.match(/^(\\d+):(\\d{1,2})$/);
            if (clock) {
              const hours = Number(clock[1]);
              const minutes = Number(clock[2]);
              if (Number.isFinite(hours) && Number.isFinite(minutes) && minutes >= 0 && minutes < 60) {
                return hours + (minutes / 60);
              }
            }
            return numberFrom(raw);
          }
          """
          if reference.count(anchor) != 1:
              raise SystemExit(f'reference-data-layout.js: expected exact numberFrom anchor once, found {reference.count(anchor)}')
          reference = reference.replace(anchor, helper)
          old = "hours: numberFrom(text(row.querySelector('.av2-rr__hours'))),"
          if reference.count(old) != 1:
              raise SystemExit(f'reference-data-layout.js: expected hours parser once, found {reference.count(old)}')
          reference = reference.replace(old, "hours: durationNumberFrom(text(row.querySelector('.av2-rr__hours'))),")
          reference_path.write_text(reference, encoding='utf-8')

          test_path = Path('tests/attendance-monthly-report-summary.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          addition = r'''

          test('decimal attendance hours are presented as clock durations', () => {
            assert.equal(formatDurationHours(1.83), '1:50');
            assert.equal(formatDurationHours(1.75), '1:45');
            assert.equal(formatDurationHours(1.5), '1:30');
            assert.equal(formatDurationHours(3), '3:00');
          });

          test('attendance UI uses H:MM formatting instead of decimal hours', async () => {
            const [reports, home, newReport, summaryRow, referenceLayout] = await Promise.all([
              readFile(new URL('../attendance/src/screens/my-reports-screen.js', import.meta.url), 'utf8'),
              readFile(new URL('../attendance/src/screens/home-screen.js', import.meta.url), 'utf8'),
              readFile(new URL('../attendance/src/screens/new-report-screen.js', import.meta.url), 'utf8'),
              readFile(new URL('../attendance/src/components/report-summary-row.js', import.meta.url), 'utf8'),
              readFile(new URL('../attendance/src/reference-data-layout.js', import.meta.url), 'utf8'),
            ]);
            assert.match(reports, /hoursCell\.textContent = formatDurationHours\(record\.total_hours\)/);
            assert.match(home, /buildStat\(formatDurationHours\(summary\.totalHours\)/);
            assert.match(newReport, /h > 0 \? formatDurationHours\(h\) : '—'/);
            assert.match(summaryRow, /hours\.textContent = formatDurationHours\(record\.total_hours\)/);
            assert.match(referenceLayout, /durationNumberFrom\(text\(row\.querySelector\('\.av2-rr__hours'\)\)\)/);
            assert.doesNotMatch(reports, /record\.total_hours[^\n]*toFixed\(2\)/);
            assert.doesNotMatch(summaryRow, /record\.total_hours[^\n]*toFixed\(2\)/);
          });
          '''
          if "decimal attendance hours are presented as clock durations" not in test_text:
              test_path.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
      - run: npm ci
      - name: Run attendance duration tests
        run: node --test tests/attendance-monthly-report-summary.test.mjs
      - name: Build
        run: npm run build
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance/src/components/report-summary-row.js attendance/src/screens/my-reports-screen.js attendance/src/screens/home-screen.js attendance/src/screens/new-report-screen.js attendance/src/reference-data-layout.js tests/attendance-monthly-report-summary.test.mjs
          git commit -m "Format attendance hours as H:MM"
          git push origin HEAD:codex/format-attendance-hours-hhmm-20260916