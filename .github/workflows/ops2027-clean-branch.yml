name: Build Clean Operations 2027 Branch

on:
  push:
    branches:
      - codex/clean-loading-and-cache-mechanisms

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: codex/clean-loading-and-cache-mechanisms
          fetch-depth: 0

      - name: Create one-commit branch from latest main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          source_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git switch -C fix/operations-2027-loading-cache-final origin/main
          git checkout "$source_head" -- \
            frontend/src/config.js \
            frontend/src/feature-loaders.js \
            frontend/src/screens/operations-2027-loading-controller.js \
            frontend/src/screens/operations-authorities-cleanup.js \
            frontend/src/screens/operations-summer-training-matrix.js \
            frontend/sw.js \
            tests/operations-2027-custom-tabs-click-fix.test.mjs \
            tests/operations-2027-loading-controller.test.mjs \
            tests/operations-2027-table-layout-fix.test.mjs \
            tests/operations-2027-training-assignment-fix.test.mjs \
            tests/operations-2027-training-kit-history-fix.test.mjs \
            tests/operations-2027-training-kits.test.mjs \
            tests/operations-2027-workshop-training-matrix.test.mjs \
            tests/operations-lazy-loading.test.mjs
          git add -A
          git commit -m "Finalize Operations 2027 loading and cache cleanup"
          git push --force origin fix/operations-2027-loading-cache-final
