name: Validate Clean Operations 2027 Branch

on:
  push:
    branches:
      - codex/clean-loading-and-cache-mechanisms

permissions:
  contents: write

jobs:
  validate-clean-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7
        with:
          ref: codex/clean-loading-and-cache-mechanisms
          fetch-depth: 0

      - name: Checkout clean target branch
        run: |
          git fetch --no-tags origin fix/operations-2027-loading-cache-final
          git switch --detach origin/fix/operations-2027-loading-cache-final

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Operations 2027
        run: |
          node --check frontend/src/screens/operations-2027-loading-controller.js
          node --check frontend/src/screens/operations-summer-training-matrix.js
          for test_file in tests/operations-2027-*.test.mjs tests/operations-lazy-loading.test.mjs; do
            echo "=== $test_file ==="
            node --test --test-force-exit "$test_file"
          done
          npm run check:build
          npm run check:pwa

      - name: Record successful validation
        run: |
          target_sha="$(git rev-parse HEAD)"
          git switch codex/clean-loading-and-cache-mechanisms
          printf '%s\n' "$target_sha" > .ops2027-validation-success
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ops2027-validation-success
          if git diff --cached --quiet; then
            echo "Validation marker already current"
          else
            git commit -m "Record clean Operations 2027 validation"
            git push origin codex/clean-loading-and-cache-mechanisms
          fi
