name: Operations 2027 Branch Cleanup

on:
  push:
    branches:
      - codex/clean-loading-and-cache-mechanisms

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/clean-loading-and-cache-mechanisms
          fetch-depth: 0

      - name: Restore standard workflow and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/quick-pr-check.yml tests/operations-management-screen.test.mjs
          git rm .github/workflows/ops2027-branch-repair.yml
          git commit -m "Clean temporary Operations 2027 validation files"
          git push origin HEAD:codex/clean-loading-and-cache-mechanisms
