name: E2E and Performance Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Capture and upload a fresh performance baseline artifact'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: e2e-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-performance:
    name: e2e-performance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect E2E scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || github.event.action == 'reopened' || (github.event.action == 'opened' && github.event.pull_request.draft == false))) }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/e2e-changed-files.txt
          else
            : > /tmp/e2e-changed-files.txt
          fi

          echo 'Changed files:'
          cat /tmp/e2e-changed-files.txt
          node scripts/select-e2e-scope.mjs < /tmp/e2e-changed-files.txt

      - name: Verify scope selector
        run: node --test tests/e2e-scope.test.mjs

      - name: Publish scope summary
        run: |
          {
            echo '## E2E scope'
            echo ''
            echo "- Mode: ${{ steps.scope.outputs.mode }}"
            echo "- Screens: ${{ steps.scope.outputs.screens || 'none' }}"
            echo "- Reason: ${{ steps.scope.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Documentation-only check
        if: steps.scope.outputs.mode == 'docs'
        run: echo 'Documentation-only change detected. Browser tests are not required.'

      - name: Verify required E2E secrets
        if: steps.scope.outputs.mode != 'docs'
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          missing=0
          if [ -z "$E2E_USERNAME" ]; then
            echo '::error::Missing GitHub Secret E2E_USERNAME (dedicated test login username)'
            missing=1
          fi
          if [ -z "$E2E_PASSWORD" ]; then
            echo '::error::Missing GitHub Secret E2E_PASSWORD (dedicated test login entry code)'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo 'Add repository secrets at Settings → Secrets and variables → Actions:'
            echo '  E2E_USERNAME, E2E_PASSWORD'
            echo 'Also set E2E_BASE_URL for post-deploy smoke (live Pages URL).'
            echo 'VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are used when present; the app also has publishable fallbacks.'
            exit 1
          fi
          echo 'E2E credentials secret presence OK'

      - name: Setup Node.js
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.mode != 'docs'
        run: npm install

      - name: Install Playwright Chromium
        if: steps.scope.outputs.mode != 'docs'
        run: npx playwright install chromium --with-deps

      - name: Build production
        if: steps.scope.outputs.mode != 'docs'
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run targeted Playwright checks
        if: steps.scope.outputs.mode == 'targeted'
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
          E2E_GREP: ${{ steps.scope.outputs.grep }}
        run: npx playwright test -c e2e/playwright.config.mjs --grep "$E2E_GREP"

      - name: Run full Playwright E2E and performance gate
        if: steps.scope.outputs.mode == 'full'
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline == 'true' && '1' || '0' }}
        run: npm run test:e2e

      - name: Upload Playwright reports and evidence
        if: ${{ always() && steps.scope.outputs.mode != 'docs' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-performance-evidence-${{ github.sha }}
          path: |
            e2e/artifacts/
            e2e/baselines/performance-baseline.json
          if-no-files-found: warn
          retention-days: 14
