name: Validate summer proposals list

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/proposal-summer-list-runtime.js'
      - 'frontend/src/feature-loaders.js'
      - 'frontend/src/config.js'
      - 'frontend/sw.js'
      - 'tests/proposal-summer-list-runtime.test.mjs'
      - 'tests/proposal-editor-compact-fixes.test.mjs'
      - 'e2e/tests/14-proposal-summer-list.spec.mjs'
      - '.github/workflows/validate-proposal-summer-list.yml'

permissions:
  contents: read

jobs:
  summer-proposals-list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check focused source files
        run: |
          node --check frontend/src/proposal-summer-list-runtime.js
          node --check tests/proposal-summer-list-runtime.test.mjs
          node --check e2e/tests/14-proposal-summer-list.spec.mjs

      - name: Run focused Node tests
        run: node --test tests/proposal-summer-list-runtime.test.mjs tests/proposal-workflow-completion.test.mjs tests/proposal-editor-compact-fixes.test.mjs

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build production bundle
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run summer proposals browser check
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
        run: npx playwright test -c e2e/playwright.config.mjs e2e/tests/14-proposal-summer-list.spec.mjs --project=chromium

      - name: Check production and PWA guardrails
        run: |
          npm run check:build
          npm run check:pwa

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summer-proposals-list-evidence-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
