name: Payroll attendance reconciliation

on:
  pull_request:
    paths:
      - 'frontend/src/screens/finance.js'
      - 'frontend/src/screens/finance-attendance-summary.js'
      - 'frontend/src/screens/attendance-control.js'
      - 'frontend/src/screens/payroll-control-finish.js'
      - 'tests/finance-screen.test.mjs'
      - 'tests/attendance-employee-export.test.mjs'
      - 'tests/payroll-transit-hour-reconciliation.test.mjs'
      - '.github/workflows/payroll-attendance-reconciliation.yml'
  workflow_dispatch:

jobs:
  payroll-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify finance exports, approved payroll and transport compensation
        run: node --test tests/finance-screen.test.mjs tests/attendance-employee-export.test.mjs tests/payroll-transit-hour-reconciliation.test.mjs
