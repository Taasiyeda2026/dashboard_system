name: Apply base training attendance option

on:
  push:
    branches:
      - codex/add-base-training-attendance-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-base-training-attendance-20260916
      - name: Apply focused fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('attendance/src/screens/new-report-screen.js')
          s = p.read_text()

          old = "const TIME_MINUTE_STEP = 5;\nconst COURSE_REPORT_TYPE = 'קורס';\nconst ALL_CANONICAL_REPORT_TYPES = new Set(['ביטול זמן', TRAINING_REPORT_TYPE, ONLINE_REPORT_TYPE]);"
          new = """const TIME_MINUTE_STEP = 5;
          const COURSE_REPORT_TYPE = 'קורס';
          const BASE_TRAINING_OPTION_VALUE = '__attendance_base_training__';
          const BASE_TRAINING_ACTIVITY = Object.freeze({
            row_id: BASE_TRAINING_OPTION_VALUE,
            activity_name: 'הכשרת בסיס',
            program_name: null,
            authority_id: null,
            authority_name: 'יקום',
            single_school_id: null,
            single_school_name: 'Greenwork',
            single_semel_mosad: null,
            school_link_status: 'single_school',
            linked_schools_json: [],
            __attendanceSynthetic: 'base_training',
          });
          const ALL_CANONICAL_REPORT_TYPES = new Set(['ביטול זמן', TRAINING_REPORT_TYPE, ONLINE_REPORT_TYPE]);"""
          assert old in s, 'constants anchor not found'
          s = s.replace(old, new, 1)

          old = """  function findActivityByRowId(rowId) {
              const id = String(rowId || '').trim();
              if (!id) return null;
              return instructorActivities.find((item) => activityRowId(item) === id)
                || extendedActivityByRowId.get(id)
                || null;
            }

            function rememberExtendedActivity(activity) {
              const id = activityRowId(activity);
              if (id) extendedActivityByRowId.set(id, activity);
            }
          """
          new = """  function findActivityByRowId(rowId) {
              const id = String(rowId || '').trim();
              if (!id) return null;
              if (id === BASE_TRAINING_OPTION_VALUE) return BASE_TRAINING_ACTIVITY;
              return instructorActivities.find((item) => activityRowId(item) === id)
                || extendedActivityByRowId.get(id)
                || null;
            }

            function rememberExtendedActivity(activity) {
              const id = activityRowId(activity);
              if (id && id !== BASE_TRAINING_OPTION_VALUE) extendedActivityByRowId.set(id, activity);
            }

            function isBaseTrainingActivity(activity) {
              return activity?.__attendanceSynthetic === 'base_training'
                || activityRowId(activity) === BASE_TRAINING_OPTION_VALUE;
            }

            function activityOptionsForReportType(activities = [], reportType = getReportType(), query = '') {
              const source = Array.isArray(activities) ? [...activities] : [];
              if (reportType === TRAINING_REPORT_TYPE) {
                const q = String(query || '').trim().toLowerCase();
                if (!q || activitySearchHaystack(BASE_TRAINING_ACTIVITY).includes(q)) {
                  source.unshift(BASE_TRAINING_ACTIVITY);
                }
              }
              return instructorActivitySelectOptions(source, { reportType });
            }
          """
          assert old in s, 'activity helper anchor not found'
          s = s.replace(old, new, 1)

          replacements = {
            "const options = instructorActivitySelectOptions(instructorActivities, { reportType });": "const options = activityOptionsForReportType(instructorActivities, reportType);",
            "const options = instructorActivitySelectOptions([...instructorActivities, ...rows], { reportType });": "const options = activityOptionsForReportType([...instructorActivities, ...rows], reportType);",
            "|| instructorActivitySelectOptions([activity], { reportType })[0];": "|| activityOptionsForReportType([activity], reportType)[0];",
            "options: instructorActivitySelectOptions(instructorActivities, { reportType: initialReportType }),": "options: activityOptionsForReportType(instructorActivities, initialReportType),",
            "return instructorActivitySelectOptions(rows, { reportType: getReportType() });": "return activityOptionsForReportType(rows, getReportType(), query);",
          }
          for a,b in replacements.items():
              assert a in s, f'replacement anchor missing: {a}'
              s = s.replace(a,b)

          old = """      if (prefill.activity_row_id) {
                const match = findActivityByRowId(prefill.activity_row_id);
                if (match) {
                  void (async () => {
                    await applySelectedActivity(match);
                    if (prefSchoolName && schoolControl instanceof HTMLSelectElement) {
                      const option = [...schoolControl.options].find((item) => item.dataset.name === prefSchoolName);
                      if (option) {
                        schoolControl.value = option.value;
                        schoolId = Number(option.value);
                        schoolName = option.dataset.name || prefSchoolName;
                        semelMosad = option.dataset.semel ? Number(option.dataset.semel) : null;
                      }
                    }
                    if (isCourseReportType() && meetingVal) meetingField.setValue(meetingVal);
                    syncLocationDependencies();
                  })();
                }
              }
          """
          new = """      if (initialReportType === TRAINING_REPORT_TYPE
                  && String(prefill.activity_name_snapshot || '').trim() === BASE_TRAINING_ACTIVITY.activity_name) {
                void applySelectedActivity(BASE_TRAINING_ACTIVITY);
              } else if (prefill.activity_row_id) {
                const match = findActivityByRowId(prefill.activity_row_id);
                if (match) {
                  void (async () => {
                    await applySelectedActivity(match);
                    if (prefSchoolName && schoolControl instanceof HTMLSelectElement) {
                      const option = [...schoolControl.options].find((item) => item.dataset.name === prefSchoolName);
                      if (option) {
                        schoolControl.value = option.value;
                        schoolId = Number(option.value);
                        schoolName = option.dataset.name || prefSchoolName;
                        semelMosad = option.dataset.semel ? Number(option.dataset.semel) : null;
                      }
                    }
                    if (isCourseReportType() && meetingVal) meetingField.setValue(meetingVal);
                    syncLocationDependencies();
                  })();
                }
              }
          """
          assert old in s, 'prefill anchor not found'
          s = s.replace(old, new, 1)

          old = """      const activity = selectedActivity;
              const reportType = getReportType();
              const isNoActivity = isNoActivityNameType(reportType);
              const isOpen = isOpenFieldType(reportType);
              const isOnline = isOnlineReportType(reportType);
          """
          new = """      const activity = selectedActivity;
              const reportType = getReportType();
              const isNoActivity = isNoActivityNameType(reportType);
              const isOpen = isOpenFieldType(reportType);
              const isOnline = isOnlineReportType(reportType);
              const isBaseTraining = isBaseTrainingActivity(activity);
          """
          assert old in s, 'submit state anchor not found'
          s = s.replace(old, new, 1)

          payload_replacements = {
            "activity_id: isOpen ? null : (activity?.id ?? null),": "activity_id: isOpen || isBaseTraining ? null : (activity?.id ?? null),",
            "activity_row_id: isOpen ? null : (activityRowId(activity) || null),": "activity_row_id: isOpen || isBaseTraining ? null : (activityRowId(activity) || null),",
            "activity_no: isOpen ? null : (activity?.activity_no ?? null),": "activity_no: isOpen || isBaseTraining ? null : (activity?.activity_no ?? null),",
            "activity_season: isOpen ? null : (activity?.activity_season ?? null),": "activity_season: isOpen || isBaseTraining ? null : (activity?.activity_season ?? null),",
            "program_name: isOpen ? null : (activity?.program_name ?? null),": "program_name: isOpen || isBaseTraining ? null : (activity?.program_name ?? null),",
          }
          for a,b in payload_replacements.items():
              assert a in s, f'payload anchor missing: {a}'
              s = s.replace(a,b,1)

          p.write_text(s)

          # Attendance app cache/version bump.
          p = Path('attendance/index.html')
          s = p.read_text()
          assert '?v=68' in s
          p.write_text(s.replace('?v=68', '?v=69').replace('v=68 busts', 'v=69 busts'))

          p = Path('attendance/sw.js')
          s = p.read_text()
          assert 'const CACHE_VERSION = 68;' in s
          p.write_text(s.replace('const CACHE_VERSION = 68;', 'const CACHE_VERSION = 69;', 1))

          p = Path('tests/attendance-screen-structure.test.mjs')
          s = p.read_text()
          assert 'const CACHE_VERSION = 68;' in s and r'\?v=68' in s
          s = s.replace('const CACHE_VERSION = 68;', 'const CACHE_VERSION = 69;')
          s = s.replace(r'\?v=68', r'\?v=69')
          p.write_text(s)

          Path('tests/attendance-base-training.test.mjs').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const source = await readFile(new URL('../attendance/src/screens/new-report-screen.js', import.meta.url), 'utf8');

          test('training includes fixed base-training attendance option with automatic location snapshots', () => {
            assert.match(source, /activity_name: 'הכשרת בסיס'/);
            assert.match(source, /authority_name: 'יקום'/);
            assert.match(source, /single_school_name: 'Greenwork'/);
            assert.match(source, /school_link_status: 'single_school'/);
            assert.match(source, /if \(reportType === TRAINING_REPORT_TYPE\)/);
            assert.match(source, /source\.unshift\(BASE_TRAINING_ACTIVITY\)/);
            assert.match(source, /if \(id === BASE_TRAINING_OPTION_VALUE\) return BASE_TRAINING_ACTIVITY/);
          });

          test('base training is stored as attendance snapshots and never as a fake canonical activity id', () => {
            assert.match(source, /const isBaseTraining = isBaseTrainingActivity\(activity\)/);
            assert.match(source, /activity_id: isOpen \|\| isBaseTraining \? null/);
            assert.match(source, /activity_row_id: isOpen \|\| isBaseTraining \? null/);
            assert.match(source, /activity_no: isOpen \|\| isBaseTraining \? null/);
            assert.match(source, /activity_season: isOpen \|\| isBaseTraining \? null/);
            assert.match(source, /program_name: isOpen \|\| isBaseTraining \? null/);
          });

          test('editing or duplicating an existing base-training record restores the fixed option', () => {
            assert.match(source, /initialReportType === TRAINING_REPORT_TYPE[\s\S]*activity_name_snapshot[\s\S]*BASE_TRAINING_ACTIVITY\.activity_name/);
            assert.match(source, /applySelectedActivity\(BASE_TRAINING_ACTIVITY\)/);
          });
          """)
          PY
      - name: Run focused tests
        run: |
          node --test \
            tests/attendance-base-training.test.mjs \
            tests/attendance-screen-structure.test.mjs \
            tests/attendance-new-report-activities.test.mjs \
            tests/attendance-activity-type-behavior.test.mjs
      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-base-training-attendance.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add attendance/src/screens/new-report-screen.js attendance/index.html attendance/sw.js tests/attendance-screen-structure.test.mjs tests/attendance-base-training.test.mjs .github/workflows/apply-base-training-attendance.yml
          git commit -m "Add base training attendance option"
          git push origin HEAD:codex/add-base-training-attendance-20260916