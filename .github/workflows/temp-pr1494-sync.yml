name: Temporary PR 1494 sync

on:
  push:
    branches:
      - codex/update-data-loading-behavior-on-guide-screen

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/update-data-loading-behavior-on-guide-screen
          fetch-depth: 0
      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT GitHub Sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts: $conflicts"
            if [ "$conflicts" != "frontend/sw.js" ]; then
              echo 'Unexpected merge conflict. Aborting without push.'
              git merge --abort
              exit 1
            fi
            git checkout --ours frontend/sw.js
            git add frontend/sw.js
            git commit --no-edit
          fi
          if ! grep -q '^const CACHE_VERSION = 1488;' frontend/sw.js; then
            echo 'Expected CACHE_VERSION 1488 was not preserved.'
            exit 1
          fi
          git rm .github/workflows/temp-pr1494-sync.yml
          git commit -m 'Remove temporary PR 1494 sync workflow'
          git push origin HEAD:codex/update-data-loading-behavior-on-guide-screen
