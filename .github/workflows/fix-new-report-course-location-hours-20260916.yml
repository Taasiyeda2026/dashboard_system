name: Fix new report course location and hours 20260916

on:
  push:
    branches:
      - codex/fix-new-report-course-location-hours-20260916

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-new-report-course-location-hours-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply approved attendance form fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('attendance/src/screens/new-report-screen.js')
          text = path.read_text(encoding='utf-8')

          location_pattern = re.compile(
            r"  function syncLocationDependencies\(\) \{\s*"
            r"const hasType = !!getReportType\(\);\s*"
            r"const showsLocation = !isOpenFieldType\(\);\s*"
            r"authSel\?\.setDisabled\(!hasType \|\| !showsLocation \|\| !!selectedActivity\);\s*"
            r"setSchoolEnabled\(hasType && showsLocation && hasSelectedAuthority\(\)\);\s*"
            r"syncMeetingFieldState\(\);\s*"
            r"\}"
          )
          location_replacement = """  function syncLocationDependencies() {
            const hasType = !!getReportType();
            const showsLocation = !isOpenFieldType();
            const courseAwaitingActivity = isCourseReportType() && !selectedActivity;
            authSel?.setDisabled(!hasType || !showsLocation || courseAwaitingActivity || !!selectedActivity);
            setSchoolEnabled(hasType && showsLocation && !courseAwaitingActivity && hasSelectedAuthority());
            syncMeetingFieldState();
          }"""
          text, count = location_pattern.subn(location_replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'location dependency replacement count={count}')

          hours_pattern = re.compile(
            r"  function updateHoursDisplay\(\) \{\s*"
            r"const h = calcHours\(startPicker\.getValue\(\), endPicker\.getValue\(\)\);\s*"
            r"hoursVal\.textContent = h > 0 \? h\.toFixed\(2\) : '—';\s*"
            r"\}"
          )
          hours_replacement = """  function updateHoursDisplay() {
            const h = calcHours(startPicker.getValue(), endPicker.getValue());
            hoursVal.textContent = h > 0 ? formatTravelMinutes(Math.round(h * 60)) : '—';
          }"""
          text, count = hours_pattern.subn(hours_replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'hours display replacement count={count}')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/attendance-screen-structure.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
            "  assert.match(newReportSource, /authSel\\?\\.setDisabled\\(!hasType/);\n  assert.match(newReportSource, /setSchoolEnabled\\(hasType && showsLocation && hasSelectedAuthority\\(\\)\\)/);",
            "  assert.match(newReportSource, /const courseAwaitingActivity = isCourseReportType\\(\\) && !selectedActivity/);\n  assert.match(newReportSource, /authSel\\?\\.setDisabled\\(!hasType \\|\\| !showsLocation \\|\\| courseAwaitingActivity \\|\\| !!selectedActivity\\)/);\n  assert.match(newReportSource, /setSchoolEnabled\\(hasType && showsLocation && !courseAwaitingActivity && hasSelectedAuthority\\(\\)\\)/);\n  assert.match(newReportSource, /formatTravelMinutes\\(Math\\.round\\(h \\* 60\\)\\)/);",
            1,
          )
          if 'courseAwaitingActivity' not in test or 'formatTravelMinutes\\(Math\\.round' not in test:
            raise SystemExit('updated test expectations missing')
          test_path.write_text(test, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: node --test tests/attendance-screen-structure.test.mjs tests/attendance-activity-type-behavior.test.mjs
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-new-report-course-location-hours-20260916.yml
          git add attendance/src/screens/new-report-screen.js tests/attendance-screen-structure.test.mjs
          git commit -m "Fix course location dependencies and duration display"
          git push origin HEAD:codex/fix-new-report-course-location-hours-20260916
