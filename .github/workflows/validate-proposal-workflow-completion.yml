name: Validate proposal workflow completion

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/proposal-workflow-completion.js'
      - 'frontend/src/proposal-workflow-ui-integrity.js'
      - 'frontend/src/screens/proposals-agreements.js'
      - 'frontend/src/feature-loaders.js'
      - 'supabase/migrations/20260802153000_restore_next_year_activity_intro.sql'
      - 'tests/proposal-workflow-completion.test.mjs'
      - 'tests/proposal-workflow-ui-integrity.test.mjs'
      - 'tests/proposal-next-year-selection-hydration.test.mjs'
      - 'tests/proposal-type-display-and-tashpaz-totals.test.mjs'
      - 'e2e/tests/11-proposal-workflow-completion.spec.mjs'
      - '.github/workflows/validate-proposal-workflow-completion.yml'
  workflow_dispatch:

concurrency:
  group: validate-proposal-workflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-proposal-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check focused JavaScript syntax
        run: |
          node --check frontend/src/proposal-workflow-completion.js
          node --check frontend/src/proposal-workflow-ui-integrity.js
          node --check frontend/src/feature-loaders.js
          node --check frontend/src/screens/proposals-agreements.js
          node --check tests/proposal-workflow-completion.test.mjs
          node --check tests/proposal-workflow-ui-integrity.test.mjs
          node --check tests/proposal-next-year-selection-hydration.test.mjs
          node --check tests/proposal-type-display-and-tashpaz-totals.test.mjs
          node --check e2e/tests/11-proposal-workflow-completion.spec.mjs

      - name: Run focused proposal tests
        run: node --test tests/proposal-workflow-completion.test.mjs tests/proposal-workflow-ui-integrity.test.mjs tests/proposal-next-year-editor-stability.test.mjs tests/proposal-next-year-selection-hydration.test.mjs tests/proposal-next-year-workshops.test.mjs tests/proposal-next-year-pricing-display.test.mjs tests/proposal-type-display-and-tashpaz-totals.test.mjs

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium --with-deps

      - name: Build production bundle
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run full proposal workflow browser test manually
        if: github.event_name == 'workflow_dispatch'
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
        run: |
          timeout --signal=TERM --kill-after=15s 6m \
            npx playwright test -c e2e/playwright.config.mjs e2e/tests/11-proposal-workflow-completion.spec.mjs \
            --project=chromium \
            --retries=0

      - name: Check production build and PWA guardrails
        run: |
          npm run check:build
          npm run check:pwa

      - name: Upload proposal screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposal-workflow-completion-evidence-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
