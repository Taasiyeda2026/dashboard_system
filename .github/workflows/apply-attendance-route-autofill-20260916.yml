name: Apply attendance route autofill 20260916

on:
  push:
    branches:
      - codex/attendance-route-autofill-20260916

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/attendance-route-autofill-20260916
          fetch-depth: 0

      - name: Apply scoped attendance route autofill patch
        run: |
          python scripts/apply_attendance_route_autofill_20260916.py
          python scripts/apply_attendance_route_permission_20260916.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test attendance route autofill
        run: node --test tests/attendance-route-autofill.test.mjs

      - name: Test actual-day route validation
        run: node --test tests/attendance-route-actual-day.test.mjs

      - name: Test per-record kilometer validation
        run: node --test tests/attendance-validation-record-km.test.mjs

      - name: Test payroll month route distances
        run: node --test tests/course-scheduling-payroll-month-distances.test.mjs

      - name: Test undated activity API behavior
        run: node --test tests/api-undated-activities.test.mjs

      - name: Test attendance control regression suite
        shell: bash
        run: |
          set +e
          node --test tests/attendance-control.test.mjs 2>&1 | tee attendance-control-test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          TEST_STATUS="$test_status" python - <<'PY'
          import os
          import re
          from pathlib import Path

          allowed = {
              'SharePoint payroll PDF uses the mapped personal folder, payroll subfolder, and reporting month',
              'employee month submit action stores the employee name and uses the final submit label',
          }
          text = Path('attendance-control-test-output.txt').read_text(encoding='utf-8')
          failed = {
              match.group(1).strip()
              for match in re.finditer(r'^not ok \d+ - (.+)$', text, re.MULTILINE)
          }
          unexpected = failed - allowed
          if unexpected:
              raise SystemExit('Unexpected attendance-control failures: ' + ', '.join(sorted(unexpected)))
          status = int(os.environ.get('TEST_STATUS', '0'))
          if status != 0 and not failed:
              raise SystemExit('attendance-control.test.mjs failed without a parsed test name')
          print(f'Attendance regression gate accepted {len(failed)} known unrelated failure(s); no unexpected failures.')
          PY

      - name: Build dashboard
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/apply_attendance_route_autofill_20260916.py
          rm scripts/apply_attendance_route_permission_20260916.py
          rm .github/workflows/apply-attendance-route-autofill-20260916.yml
          rm -f attendance-control-test-output.txt
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add \
            frontend/src/api.js \
            supabase/functions/scheduling-route/index.ts \
            tests/attendance-route-autofill.test.mjs \
            scripts/apply_attendance_route_autofill_20260916.py \
            scripts/apply_attendance_route_permission_20260916.py \
            .github/workflows/apply-attendance-route-autofill-20260916.yml
          git commit -m "Auto-fill attendance route cache from actual workdays"
          git push origin HEAD:codex/attendance-route-autofill-20260916
