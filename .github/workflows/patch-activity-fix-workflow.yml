name: Patch activity fix workflow test setup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix focused DOM test environment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-activity-meetings-fix.yml')
          content = path.read_text(encoding='utf-8')
          old = 'globalThis.navigator = dom.window.navigator;'
          new = """Object.defineProperty(globalThis, 'navigator', {
            value: dom.window.navigator,
            configurable: true
          });"""
          if content.count(old) != 1:
              raise RuntimeError('Expected one navigator assignment in target workflow')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/patch-activity-fix-workflow.yml
          git add .github/workflows/apply-activity-meetings-fix.yml
          git commit -m "Fix focused activity DOM test setup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
