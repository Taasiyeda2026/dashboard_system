name: Apply manager overdue date red fix

on:
  push:
    branches:
      - fix/manager-tracking-overdue-date-red

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manager-tracking-overdue-date-red
      - name: Apply focused UI fix
        shell: python
        run: |
          from pathlib import Path

          tracking = Path('frontend/src/manager-board-employee-file-tracking.js')
          src = tracking.read_text()
          old = '''    const due = formatDate(introDueDateForDisplay(row));
          return due
            ? `<span class="manager-workspace-deadline-date">עד ${escapeHtml(due)}</span>`
            : '<span class="manager-workspace-deadline-empty" aria-label="אין תאריך יעד">—</span>';
          '''
          new = '''    const dueIso = introDueDateForDisplay(row);
          const due = formatDate(dueIso);
          const todayIso = dateOnly(options.todayIso) || israelTodayIso(options.now || new Date());
          const overdueClass = dueIso && todayIso > dueIso ? ' manager-workspace-deadline-date--late' : '';
          return due
            ? `<span class="manager-workspace-deadline-date${overdueClass}">עד ${escapeHtml(due)}</span>`
            : '<span class="manager-workspace-deadline-empty" aria-label="אין תאריך יעד">—</span>';
          '''
          if old not in src:
              raise SystemExit('intro feedback deadline block not found')
          src = src.replace(old, new, 1)

          old_generic = '''  const due = formatDate(row?.[deadline.due]);
          return due
            ? `<span class="manager-workspace-deadline-date">עד ${escapeHtml(due)}</span>`
            : '<span class="manager-workspace-deadline-empty" aria-label="אין תאריך יעד">—</span>';
          '''
          new_generic = '''  const dueIso = dateOnly(row?.[deadline.due]);
          const due = formatDate(dueIso);
          const todayIso = dateOnly(options.todayIso) || israelTodayIso(options.now || new Date());
          const overdueClass = dueIso && todayIso > dueIso ? ' manager-workspace-deadline-date--late' : '';
          return due
            ? `<span class="manager-workspace-deadline-date${overdueClass}">עד ${escapeHtml(due)}</span>`
            : '<span class="manager-workspace-deadline-empty" aria-label="אין תאריך יעד">—</span>';
          '''
          if old_generic not in src:
              raise SystemExit('generic deadline block not found')
          src = src.replace(old_generic, new_generic, 1)
          tracking.write_text(src)

          css = Path('frontend/src/styles/manager-board-workspace.css')
          css_src = css.read_text()
          if '.manager-workspace-deadline-date--late{color:#b45309}' not in css_src:
              raise SystemExit('late date css rule not found')
          css.write_text(css_src.replace('.manager-workspace-deadline-date--late{color:#b45309}', '.manager-workspace-deadline-date--late{color:#dc2626}', 1))

          workspace = Path('frontend/src/manager-board-workspace-runtime.js')
          workspace_src = workspace.read_text()
          if "from './manager-board-employee-file-tracking.js';" not in workspace_src:
              raise SystemExit('tracking import not found')
          workspace.write_text(workspace_src.replace("from './manager-board-employee-file-tracking.js';", "from './manager-board-employee-file-tracking.js?v=20261004-overdue-date-red-v1';", 1))

          index = Path('index.html')
          index_src = index.read_text()
          if 'manager-board-workspace-runtime.js?v=20260927-approved-record-correction-v1' not in index_src:
              raise SystemExit('manager workspace version marker not found')
          index.write_text(index_src.replace('manager-board-workspace-runtime.js?v=20260927-approved-record-correction-v1', 'manager-board-workspace-runtime.js?v=20261004-overdue-date-red-v1', 1))

          sw = Path('frontend/sw.js')
          sw_src = sw.read_text()
          if 'const CACHE_VERSION = 1878;' not in sw_src:
              raise SystemExit('expected CACHE_VERSION 1878 not found')
          sw.write_text(sw_src.replace('const CACHE_VERSION = 1878;', 'const CACHE_VERSION = 1879;', 1))

          config = Path('frontend/src/config.js')
          config_src = config.read_text()
          marker = 'manager-tracking-overdue-date-red-20261004-v1'
          if marker not in config_src:
              config_src += '\nconfig.HOTFIX_VERSION = `' + marker + '-${config.HOTFIX_VERSION}`;\n'
          config.write_text(config_src)

          test = Path('tests/manager-team-tracking-overdue-date-color.test.mjs')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { COMPONENT_COLUMNS, completionCell } from '../frontend/src/manager-board-employee-file-tracking.js';

          const introColumn = COMPONENT_COLUMNS.find((column) => column.field === 'intro_feedback_completed');
          const baseRow = {
            emp_id: 9991,
            full_name: 'בדיקת תאריך',
            employment_type: 'שכיר',
            gender: 'male',
            seniority_years: 1,
            employee_created_at: '2026-08-30T10:00:00+03:00',
            intro_feedback_completed: false,
            intro_feedback_due_date: '2026-09-30'
          };

          test('past incomplete intro due date stays visible and is marked late/red', () => {
            const html = completionCell(baseRow, introColumn, { todayIso: '2026-10-04', schoolYear: '2027' });
            assert.match(html, /עד 30\.09\.26/);
            assert.match(html, /manager-workspace-deadline-date--late/);
            assert.doesNotMatch(html, /✓/);
          });

          test('future incomplete intro due date stays normal', () => {
            const html = completionCell({ ...baseRow, employee_created_at: '2026-09-28T10:00:00+03:00' }, introColumn, { todayIso: '2026-10-04', schoolYear: '2027' });
            assert.match(html, /עד 28\.10\.26/);
            assert.doesNotMatch(html, /manager-workspace-deadline-date--late/);
          });

          test('completed item shows checkmark even when its due date is in the past', () => {
            const html = completionCell({ ...baseRow, intro_feedback_completed: true }, introColumn, { todayIso: '2026-10-04', schoolYear: '2027' });
            assert.match(html, /✓/);
            assert.doesNotMatch(html, /manager-workspace-deadline-date--late/);
          });

          test('late deadline class is red in manager workspace CSS', () => {
            const css = fs.readFileSync(new URL('../frontend/src/styles/manager-board-workspace.css', import.meta.url), 'utf8');
            assert.match(css, /\.manager-workspace-deadline-date--late\{color:#dc2626\}/);
          });
          '''.replace(/^          /gm, ''))
      - name: Run focused tests
        run: >-
          node --test
          tests/manager-team-tracking-overdue-date-color.test.mjs
          tests/manager-team-tracking-feedback-windows.test.mjs
          tests/manager-team-tracking-seniority.test.mjs
          tests/manager-team-tracking-observation-rules.test.mjs
          tests/client-file-version-sync.test.mjs
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/manager-board-employee-file-tracking.js frontend/src/styles/manager-board-workspace.css frontend/src/manager-board-workspace-runtime.js frontend/src/config.js frontend/sw.js index.html tests/manager-team-tracking-overdue-date-color.test.mjs
          git commit -m "Manager tracking: mark overdue incomplete dates red"
          git push
