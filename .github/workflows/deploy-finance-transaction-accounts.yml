# Deploys ONLY finance-transaction-accounts via the official Supabase CLI.
# Never runs migrations, db push, or config push. Never prints secrets.
name: Deploy finance-transaction-accounts

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/finance-transaction-accounts/**'
      - '.github/workflows/deploy-finance-transaction-accounts.yml'
      - 'tests/finance-transaction-accounts-edge-deploy-contract.test.mjs'
      - 'scripts/ci/verify-finance-transaction-accounts-deploy.mjs'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to publish finance-transaction-accounts from this ref'
        required: true
        type: string

concurrency:
  group: deploy-finance-transaction-accounts
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public project ref (already in supabase/config.toml remotes.main).
  SUPABASE_PROJECT_REF: szinlhjuwyiyszdpsdop
  # Pin CLI for reproducible deploys; bump intentionally when upgrading.
  SUPABASE_CLI_VERSION: 2.48.3

jobs:
  deploy:
    name: deploy finance-transaction-accounts
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Require SUPABASE_ACCESS_TOKEN secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN. Create a token at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Source contract tests (full local sources, no CDN wrappers)
        run: node --test tests/finance-transaction-accounts-edge-deploy-contract.test.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy function only (no migrations / no db push / no config push)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Deploy a single named function from the checked-out tree.
          # --use-api bundles server-side (no Docker dependency on the runner).
          supabase functions deploy finance-transaction-accounts \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api \
            --yes

      - name: Download deployed sources and verify full payload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fta-verify
          mkdir -p /tmp/fta-verify/supabase/functions
          cp supabase/config.toml /tmp/fta-verify/supabase/config.toml
          supabase functions download finance-transaction-accounts \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --workdir /tmp/fta-verify
          node scripts/ci/verify-finance-transaction-accounts-deploy.mjs \
            /tmp/fta-verify/supabase/functions/finance-transaction-accounts
