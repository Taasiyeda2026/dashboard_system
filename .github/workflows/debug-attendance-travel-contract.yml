name: Debug Attendance Travel Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  activity-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="activity order" tests/attendance-travel-compensation.test.mjs
  allowance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="45 minute allowance" tests/attendance-travel-compensation.test.mjs
  operation-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="operation options" tests/attendance-travel-compensation.test.mjs
  activity-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="activity search is extended-only" tests/attendance-travel-compensation.test.mjs
  server-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="server route endpoint" tests/attendance-travel-compensation.test.mjs
  cancellation-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="generated cancellation lifecycle" tests/attendance-travel-compensation.test.mjs
  route-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="route context changes" tests/attendance-travel-compensation.test.mjs
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="source-only instructor counts" tests/attendance-travel-compensation.test.mjs
  finance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="generated cancellation is the only" tests/attendance-travel-compensation.test.mjs
  nonblocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test --test-name-pattern="instructor save and month submission" tests/attendance-travel-compensation.test.mjs
