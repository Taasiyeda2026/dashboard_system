name: Temporary work schedule sessions hotfix

on:
  push:
    branches:
      - hotfix/work-schedule-sessions-projection-20260815

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[skip hotfix runner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/work-schedule-sessions-projection-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api_path = Path('frontend/src/api.js')
          text = api_path.read_text()
          old = """const ACTIVITY_OPERATIONS_COLUMNS = [
            'row_id', 'activity_name', 'activity_type', 'item_type', 'activity_season',
            'authority', 'school', 'school_id', 'grade', 'class_group',
            'instructor_name', 'instructor_name_2', 'emp_id', 'emp_id_2',
            'start_time', 'end_time', 'start_date', 'end_date', 'status', 'participants_count',
            ...ACTIVITY_MEETING_DATE_COLUMNS
          ].join(',');"""
          new = """const ACTIVITY_OPERATIONS_COLUMNS = [
            'row_id', 'activity_name', 'activity_type', 'item_type', 'activity_season',
            'authority', 'school', 'school_id', 'grade', 'class_group',
            'instructor_name', 'instructor_name_2', 'emp_id', 'emp_id_2',
            'start_time', 'end_time', 'start_date', 'end_date', 'status', 'participants_count', 'sessions',
            ...ACTIVITY_MEETING_DATE_COLUMNS
          ].join(',');"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one ACTIVITY_OPERATIONS_COLUMNS block, found {text.count(old)}')
          api_path.write_text(text.replace(old, new, 1))

          sw_path = Path('frontend/sw.js')
          sw = sw_path.read_text()
          if 'const CACHE_VERSION = 1488;' not in sw:
              raise SystemExit('Expected CACHE_VERSION 1488')
          sw_path.write_text(sw.replace('const CACHE_VERSION = 1488;', 'const CACHE_VERSION = 1489;', 1))

          config_path = Path('frontend/src/config.js')
          config = config_path.read_text()
          marker = "HOTFIX_VERSION: '"
          if marker not in config:
              raise SystemExit('HOTFIX_VERSION marker not found')
          config_path.write_text(config.replace(marker, marker + 'work-schedule-sessions-projection-20260815-v1-', 1))

          test_path = Path('tests/work-schedule-sessions-projection.test.mjs')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('operations activity projection includes declared sessions required by work-schedule readiness', () => {
            const source = fs.readFileSync(new URL('../frontend/src/api.js', import.meta.url), 'utf8');
            const match = source.match(/const ACTIVITY_OPERATIONS_COLUMNS = \\[([\\s\\S]*?)\\]\\.join\\(','\\);/);
            assert.ok(match, 'ACTIVITY_OPERATIONS_COLUMNS block must exist');
            assert.match(match[1], /'sessions'/, 'work-schedule activity rows must include sessions');
          });
          """)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused checks
        run: |
          node --check frontend/src/api.js
          node --test tests/work-schedule-sessions-projection.test.mjs
          node --test --test-name-pattern="school_2027 work schedule includes a course" tests/operations-management-screen.test.mjs
          npm run check:pwa
          npm run build
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'ChatGPT GitHub Fix'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/src/api.js frontend/src/config.js frontend/sw.js tests/work-schedule-sessions-projection.test.mjs
          git commit -m 'Fix work schedule sessions projection [skip hotfix runner]'
          git push origin HEAD:hotfix/work-schedule-sessions-projection-20260815
