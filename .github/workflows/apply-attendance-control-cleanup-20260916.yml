name: Apply attendance control cleanup 20260916

on:
  push:
    branches:
      - codex/attendance-control-cleanup-20260916

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/attendance-control-cleanup-20260916
          fetch-depth: 0

      - name: Apply scoped attendance control patch
        run: |
          python scripts/apply_attendance_control_cleanup_20260916.py
          python scripts/update_attendance_control_expectations_20260916.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused attendance validation tests
        run: |
          node --test tests/attendance-validation-record-km.test.mjs
          node --test --test-name-pattern="May non-activity reports|payroll view groups reports by work day and compares kilometers per record" tests/attendance-control.test.mjs

      - name: Build dashboard
        run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          rm scripts/apply_attendance_control_cleanup_20260916.py
          rm scripts/update_attendance_control_expectations_20260916.py
          rm .github/workflows/apply-attendance-control-cleanup-20260916.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add \
            frontend/src/screens/attendance-control.js \
            tests/attendance-validation-record-km.test.mjs \
            tests/attendance-control.test.mjs \
            scripts/apply_attendance_control_cleanup_20260916.py \
            scripts/update_attendance_control_expectations_20260916.py \
            .github/workflows/apply-attendance-control-cleanup-20260916.yml
          git commit -m "Clean up attendance validation details"
          git push origin HEAD:codex/attendance-control-cleanup-20260916
