name: Clean base training formatting

on:
  push:
    branches:
      - codex/add-base-training-attendance-20260916

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-base-training-attendance-20260916
      - name: Clean formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('attendance/src/screens/new-report-screen.js')
          s = p.read_text()
          old = """      if (
          initialReportType === TRAINING_REPORT_TYPE
          && String(prefill.activity_name_snapshot || '').trim() === BASE_TRAINING_ACTIVITY.activity_name
        ) {
          void applySelectedActivity(BASE_TRAINING_ACTIVITY);
        } else if (prefill.activity_row_id) {
          """
          new = """      if (
            initialReportType === TRAINING_REPORT_TYPE
            && String(prefill.activity_name_snapshot || '').trim() === BASE_TRAINING_ACTIVITY.activity_name
          ) {
            void applySelectedActivity(BASE_TRAINING_ACTIVITY);
          } else if (prefill.activity_row_id) {
          """
          assert old in s, 'formatting block not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          node --test tests/attendance-base-training.test.mjs tests/attendance-activity-type-behavior.test.mjs
          npm run ci:quick
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-base-training-format.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add attendance/src/screens/new-report-screen.js .github/workflows/cleanup-base-training-format.yml
          git commit -m "Polish base training attendance flow"
          git push origin HEAD:codex/add-base-training-attendance-20260916