name: Temporary Feedback PDF Smoke
on:
  push:
    branches:
      - fix/feedback-overview-templates-print-pdf-20261009
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test published questionnaire PDF
        run: node --test tests/impact-feedback-paper-pdf.test.mjs
      - name: Build frontend with PDF and templates
        run: npm run build
