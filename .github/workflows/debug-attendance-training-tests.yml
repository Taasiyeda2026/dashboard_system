name: Debug Attendance Training Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  new-report-activities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test tests/attendance-new-report-activities.test.mjs

  activity-type-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test tests/attendance-activity-type-behavior.test.mjs

  online-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test tests/attendance-time-cancellation-online-training.test.mjs

  travel-compensation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test tests/attendance-travel-compensation.test.mjs
