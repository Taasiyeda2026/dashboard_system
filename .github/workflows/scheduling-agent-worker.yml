name: Taasiyeda Scheduling Agent Engine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduling-agent-worker.yml'
      - 'services/scheduling-agent/**'
      - 'supabase/functions/scheduling-agent-worker-api/**'
  schedule:
    # GitHub may delay a scheduled invocation. This is an eventually consistent queue poll.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduling-agent-production
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Taasiyeda2026/dashboard_system' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authorized agent engine (no GitHub secrets)
        run: node services/scheduling-agent/github-worker.mjs
