name: Apply compact email copy icon

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/screens/instructor-contacts.js'
      - 'tests/instructor-contacts-screen.test.mjs'
      - '.github/workflows/apply-compact-email-copy-icon.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: polish/instructor-email-copy-icon

      - name: Apply compact icon change
        run: |
          python - <<'PY'
          from pathlib import Path

          screen_path = Path('frontend/src/screens/instructor-contacts.js')
          screen = screen_path.read_text(encoding='utf-8')
          old_button = '''<button type="button" class="ds-btn ds-btn--xs ds-btn--ghost" data-copy-instructor-email="${escapeHtml(copyValue)}" aria-label="העתקת כתובת המייל" title="העתקת כתובת המייל" style="direction:rtl;white-space:nowrap">⧉ העתקה</button>'''
          new_button = '''<button type="button" class="ds-btn ds-btn--ghost" data-copy-instructor-email="${escapeHtml(copyValue)}" aria-label="העתקת כתובת המייל" title="העתקת כתובת המייל" style="width:28px;height:28px;min-width:28px;padding:0;border-radius:8px;display:inline-grid;place-items:center;line-height:1;flex:0 0 28px"><svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>'''
          if old_button in screen:
              screen = screen.replace(old_button, new_button, 1)
              screen_path.write_text(screen, encoding='utf-8')
          elif new_button not in screen:
              raise SystemExit('copy button markup not found')

          test_path = Path('tests/instructor-contacts-screen.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          old_assertions = '''    assert.equal(copyButton.getAttribute('aria-label'), 'העתקת כתובת המייל');
              copyButton.dispatchEvent(new dom.window.MouseEvent('click', { bubbles: true }));'''
          new_assertions = '''    assert.equal(copyButton.getAttribute('aria-label'), 'העתקת כתובת המייל');
              assert.equal(copyButton.textContent.trim(), '');
              assert.ok(copyButton.querySelector('svg'));
              assert.equal(copyButton.style.width, '28px');
              copyButton.dispatchEvent(new dom.window.MouseEvent('click', { bubbles: true }));'''
          if old_assertions in tests:
              tests = tests.replace(old_assertions, new_assertions, 1)
              test_path.write_text(tests, encoding='utf-8')
          elif new_assertions not in tests:
              raise SystemExit('copy button test block not found')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run focused tests
        run: node --test tests/instructor-contacts-screen.test.mjs

      - name: Build production bundle
        run: npm run check:build

      - name: Check PWA cache guardrails
        run: npm run check:pwa

      - name: Commit verified change
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/instructor-contacts.js tests/instructor-contacts-screen.test.mjs
          git commit -m "Use compact icon-only email copy button"
          git push origin HEAD:polish/instructor-email-copy-icon
