name: Apply personal reports leave fix

on:
  push:
    branches:
      - fix/personal-reports-leave-summary
    paths:
      - .github/workflows/apply-personal-reports-leave-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/personal-reports-leave-summary
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply leave-day fix
        run: node scripts/apply-personal-reports-leave-fix.mjs

      - name: Run personal reports regression tests
        run: node --test tests/personal-reports-screen.test.mjs

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/personal-reports.js tests/personal-reports-screen.test.mjs frontend/sw.js
          git diff --cached --check
          git commit -m "Fix personal report leave-day summaries"
          git push origin HEAD:fix/personal-reports-leave-summary
