name: Validate 2026 archive and instructors UI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/screens/shared/exceptions-metrics.js'
      - 'frontend/src/instructors-header-cleanup.js'
      - 'frontend/src/config.js'
      - 'frontend/sw.js'
      - 'supabase/migrations/20260802194500_align_team_calendar_events_display_order.sql'
      - 'tests/closed-summer-archive-exceptions.test.mjs'
      - 'tests/instructors-header-cleanup.test.mjs'
      - 'tests/proposal-editor-compact-fixes.test.mjs'
      - 'e2e/tests/13-instructors-header-cleanup.spec.mjs'
      - '.github/workflows/validate-2026-archive-instructors-ui.yml'

permissions:
  contents: read

jobs:
  validate-archive-and-instructors-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check focused source files
        run: |
          node --check frontend/src/screens/shared/exceptions-metrics.js
          node --check frontend/src/instructors-header-cleanup.js
          node --check tests/closed-summer-archive-exceptions.test.mjs
          node --check tests/instructors-header-cleanup.test.mjs
          node --check e2e/tests/13-instructors-header-cleanup.spec.mjs

      - name: Run focused Node tests
        run: |
          node --test \
            tests/closed-summer-archive-exceptions.test.mjs \
            tests/instructors-header-cleanup.test.mjs \
            tests/exceptions-canonical-logic.test.mjs \
            tests/proposal-editor-compact-fixes.test.mjs

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build production bundle
        env:
          VITE_BASE: ./
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run instructors browser check
        env:
          CI: 'true'
          E2E_START_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_UPDATE_BASELINE: '0'
        run: npx playwright test -c e2e/playwright.config.mjs e2e/tests/13-instructors-header-cleanup.spec.mjs --project=chromium

      - name: Check PWA cache guardrails
        run: npm run check:pwa

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-instructors-ui-evidence-${{ github.sha }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
