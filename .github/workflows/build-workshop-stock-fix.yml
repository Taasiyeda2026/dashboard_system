name: Build workshop stock fix

on:
  push:
    branches:
      - fix/workshop-stock-location-status
    paths:
      - 'frontend/**'
      - 'tests/workshop-stock-location-status.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workshop-stock-location-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/workshop-stock-location-status.test.mjs
      - run: node --test tests/operations-2027-workshop-inventory-contracts.test.mjs tests/operations-management-screen.test.mjs
      - run: npm run check:build
      - name: Commit refreshed dist
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dist; then
            echo 'dist already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'build: refresh dist for workshop stock location status'
          git push
