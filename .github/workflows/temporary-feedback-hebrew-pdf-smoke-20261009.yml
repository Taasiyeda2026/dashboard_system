name: Temporary Hebrew Feedback PDF Visual Check
on:
  push:
    branches: [fix/feedback-paper-pdf-hebrew-acrobat-20261009]
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate real Hebrew PDF and run focused regression tests
        run: IFB_PDF_SMOKE_OUTPUT=/tmp/feedback-hebrew.pdf node --test tests/impact-feedback-paper-pdf.test.mjs
      - name: Validate Hebrew text extraction and render first page
        run: |
          pdfinfo /tmp/feedback-hebrew.pdf | grep -E '(Page size|Pages:|File size)'
          pdftotext -layout /tmp/feedback-hebrew.pdf /tmp/feedback-hebrew.txt
          echo "=== EXTRACTED_TEXT ==="
          sed -n '1,42p' /tmp/feedback-hebrew.txt
          pdftoppm -f 1 -l 1 -scale-to 850 -png -singlefile /tmp/feedback-hebrew.pdf /tmp/feedback-hebrew
          python3 - <<'PY'
          import base64
          raw = open('/tmp/feedback-hebrew.png', 'rb').read()
          print('=== PAGE_PNG_BASE64_BEGIN ===')
          print(base64.b64encode(raw).decode('ascii'))
          print('=== PAGE_PNG_BASE64_END ===')
          PY
