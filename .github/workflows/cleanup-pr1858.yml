name: Clean PR 1858 daily total

on:
  push:
    branches:
      - codex/fix-display-of-hours-in-attendance-interface-fr8ljq

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only daily-total changes from old head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin b9520550217e9efa534ec348736623e4f5138ae0
          git checkout b9520550217e9efa534ec348736623e4f5138ae0 -- \
            attendance/src/components/monthly-report-summary.js \
            attendance/src/mobile-reports-enhancer.js \
            attendance/src/reference-data-layout.js \
            attendance/src/screens/my-reports-screen.js \
            attendance/src/styles/desktop-density.css \
            attendance/src/styles/mobile-reports.css \
            attendance/src/styles/my-reports-screen.css \
            attendance/src/styles/reports-table-polish.css \
            tests/attendance-monthly-report-summary.test.mjs
      - name: Verify focused tests
        run: node --test --test-name-pattern="daily total column|expanded mobile row" tests/attendance-monthly-report-summary.test.mjs tests/attendance-mobile-expandable-rows.test.mjs
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit clean branch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-pr1858.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            attendance/src/components/monthly-report-summary.js \
            attendance/src/mobile-reports-enhancer.js \
            attendance/src/reference-data-layout.js \
            attendance/src/screens/my-reports-screen.js \
            attendance/src/styles/desktop-density.css \
            attendance/src/styles/mobile-reports.css \
            attendance/src/styles/my-reports-screen.css \
            attendance/src/styles/reports-table-polish.css \
            tests/attendance-monthly-report-summary.test.mjs
          git commit -m "Add daily total column to attendance reports"
          git push origin HEAD:codex/fix-display-of-hours-in-attendance-interface-fr8ljq
