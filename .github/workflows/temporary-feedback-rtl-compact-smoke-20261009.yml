name: Temporary Feedback PDF Hebrew RTL & A4 Check
on:
  push:
    branches: [fix/feedback-pdf-rtl-reading-order-20261009]
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test full text, RTL rendering and one-page green leadership
        run: IFB_PDF_SMOKE_OUTPUT=/tmp/green-leadership-a4.pdf node --test tests/impact-feedback-paper-pdf.test.mjs
      - name: Render A4 questionnaire and inspect extracted Hebrew
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdfinfo /tmp/green-leadership-a4.pdf | grep -E '(Page size|Pages:|File size)'
          pdftotext -layout /tmp/green-leadership-a4.pdf /tmp/green-leadership-a4.txt
          echo '=== EXTRACTED_TEXT_START ==='
          sed -n '1,80p' /tmp/green-leadership-a4.txt
          echo '=== EXTRACTED_TEXT_END ==='
          pdftoppm -f 1 -l 1 -scale-to 1100 -png -singlefile /tmp/green-leadership-a4.pdf /tmp/green-leadership-a4
          python3 - <<'PY'
          import base64
          raw = open('/tmp/green-leadership-a4.png', 'rb').read()
          print('=== PAGE_PNG_BASE64_BEGIN ===')
          print(base64.b64encode(raw).decode('ascii'))
          print('=== PAGE_PNG_BASE64_END ===')
          PY
