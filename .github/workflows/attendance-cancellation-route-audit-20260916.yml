name: Attendance cancellation route audit
on:
  push:
    branches:
      - codex/attendance-cancellation-route-audit-20260916
permissions:
  contents: write
jobs:
  patch-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/attendance-cancellation-route-audit-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply approved route audit patch
        run: python .github/scripts/patch_attendance_cancellation_route.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused attendance tests
        run: node --test tests/attendance-travel-compensation.test.mjs tests/attendance-control-review-ui.test.mjs tests/attendance-route-actual-day.test.mjs tests/attendance-validation-record-km.test.mjs
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/attendance-cancellation-route-audit-20260916.yml .github/scripts/patch_attendance_cancellation_route.py
          git add frontend/src/payroll-attendance-v2-bridge.js frontend/src/screens/attendance-control.js tests/attendance-travel-compensation.test.mjs
          git commit -m "Show and validate daily route for travel cancellation"
          git push origin HEAD:codex/attendance-cancellation-route-audit-20260916
