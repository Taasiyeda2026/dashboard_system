name: Attendance Zoom location protection

on:
  pull_request:
    paths:
      - 'attendance/src/**'
      - 'attendance/index.html'
      - 'attendance/sw.js'
      - 'tests/attendance-zoom-location.test.mjs'
      - 'tests/attendance-activity-type-behavior.test.mjs'
      - '.github/workflows/attendance-zoom-location.yml'
  workflow_dispatch:

jobs:
  zoom-location:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all online attendance location paths
        run: |
          node --test tests/attendance-zoom-location.test.mjs tests/attendance-activity-type-behavior.test.mjs tests/attendance-new-report-activities.test.mjs tests/attendance-time-cancellation-online-training.test.mjs
          node --check attendance/src/screens/new-report-screen.js
          node --check attendance/src/screens/my-reports-screen.js
          node --check attendance/src/services/attendance.service.js
