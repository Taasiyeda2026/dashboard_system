name: Temporary PR 1494 repair runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/update-data-loading-behavior-on-guide-screen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge current main and apply exact fixes
        run: |
          git config user.name 'ChatGPT GitHub Fix'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-edit origin/main
          python3 - <<'PY'
          from pathlib import Path

          ops_path = Path('frontend/src/screens/operations-management.js')
          text = ops_path.read_text()
          old = "    const filterBaseRows = instructorsContext\n      ? filterSourceRows.filter((row) => activityMatchesPeriod(row, ops.period)\n        && String(row?.status || '').trim() === String(ensureActivityListFilters(state, SCOPE).status || '').trim())\n      : baseRows;"
          new = "    const selectedFilterStatus = instructorsContext\n      ? String(ensureActivityListFilters(state, SCOPE).status || '').trim()\n      : '';\n    const filterBaseRows = instructorsContext\n      ? filterSourceRows.filter((row) => activityMatchesPeriod(row, ops.period)\n        && (!selectedFilterStatus || selectedFilterStatus === 'הכל' || String(row?.status || '').trim() === selectedFilterStatus))\n      : baseRows;"
          if old not in text:
              raise SystemExit('operations-management target block not found')
          ops_path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/operations-management-screen.test.mjs')
          text = test_path.read_text()
          old = "      tab: 'instructors',\n      context: 'instructors',\n      period: 'regular',"
          new = "      tab: 'instructors',\n      context: 'instructors',\n      scheduleHasLoaded: true,\n      period: 'regular',"
          if old not in text:
              raise SystemExit('scheduleState target block not found')
          text = text.replace(old, new, 1)

          marker = "const allStatusHtml = operationsManagementScreen.render"
          if marker not in text:
              old = "  assert.match(html, /תמיר - חדר בריחה קווסט/);\n  assert.match(html, /אפרת אוחיון/);\n});"
              new = "  assert.match(html, /תמיר - חדר בריחה קווסט/);\n  assert.match(html, /אפרת אוחיון/);\n\n  state.listFilters['operations-management'].status = '';\n  state.listFilters['operations-management'].instructor = '';\n  const allStatusHtml = operationsManagementScreen.render({ rows: [], filterOptionRows: rows, workshopStockMap: new Map() }, { state });\n  assert.match(allStatusHtml, /<option value=\"מסגרת תמיר\">מסגרת תמיר<\\/option>/);\n  assert.match(allStatusHtml, /<option value=\"אפרת אוחיון\">אפרת אוחיון<\\/option>/);\n  assert.match(allStatusHtml, /<option value=\"תמיר - חדר בריחה קווסט\">תמיר - חדר בריחה קווסט<\\/option>/);\n});"
              if old not in text:
                  raise SystemExit('secondary-instructor assertion target block not found')
              text = text.replace(old, new, 1)
          test_path.write_text(text)

          config_path = Path('frontend/src/config.js')
          text = config_path.read_text()
          hotfix = 'work-schedule-all-status-20260815-v1'
          if hotfix not in text:
              needle = "  HOTFIX_VERSION: '"
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit('HOTFIX_VERSION marker not found')
              start = pos + len(needle)
              config_path.write_text(text[:start] + hotfix + '-' + text[start:])

          for path in (Path('.github/workflows/temp-pr1494-fix.yml'), Path('.github/workflows/temp-pr1494-runner.yml')):
              if path.exists():
                  path.unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run regression checks
        run: |
          node --check frontend/src/screens/operations-management.js
          node --test tests/operations-lazy-loading.test.mjs tests/operations-management-screen.test.mjs
          node --test tests/ci-check-plan.test.mjs
          npm run check:pwa
          npm run build
          git diff --check
      - name: Commit and push repaired branch
        run: |
          git add -A
          git commit -m 'Fix work schedule all-status regression'
          git push origin HEAD:codex/update-data-loading-behavior-on-guide-screen
