name: PR1833 Focused Date Race Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused-date-edit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run new race regression tests
        run: node --test --test-force-exit tests/activity-edit-date-race-guard.test.mjs
      - name: Run existing date/session regressions independently
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/activity-edit-session-generation.test.mjs \
            tests/activity-edit-dependent-name.test.mjs \
            tests/edit-requests-flow.test.mjs \
            tests/activity-school-calendar-historical-edit.test.mjs \
            tests/activity-routine-stability-runtime.test.mjs \
            tests/activity-local-session-count.test.mjs \
            tests/activity-detail-sessions-progress.test.mjs
          do
            echo "=== $file ==="
            node --test --test-force-exit "$file"
          done
