name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_BASE: /dashboard_system/
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify proposal workshops in Pages artifact
        run: |
          node --test tests/proposal-next-year-workshops.test.mjs tests/service-worker-pwa-cache.test.mjs
          test "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          grep -R --include='*.js' -q 'next_year_workshops' dist/assets
          grep -R --include='*.js' -q 'סדנאות' dist/assets
          grep -q 'const CACHE_VERSION = 1309;' dist/sw.js
          node -e "const m=require('./dist/build-metadata.json'); if(m.commit !== process.env.GITHUB_SHA || !m.nextYearCourses || !m.nextYearWorkshops) process.exit(1)"
          if grep -q 'ignoreSearch[[:space:]]*:[[:space:]]*true' dist/sw.js; then
            echo 'Pages artifact must preserve query-string cache busting' >&2
            exit 1
          fi

      - name: Upload Pages artifact (dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed commit and proposal sections
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${PAGE_URL}build-metadata.json?commit=${GITHUB_SHA}" \
              --output live-build-metadata.json || true
            if node -e "const m=require('./live-build-metadata.json'); if(m.commit !== process.env.GITHUB_SHA || m.cacheVersion !== 1309 || !m.nextYearCourses || !m.nextYearWorkshops) process.exit(1)" 2>/dev/null; then
              cat live-build-metadata.json
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages is not serving the deployed commit' >&2
          cat live-build-metadata.json 2>/dev/null || true
          exit 1
