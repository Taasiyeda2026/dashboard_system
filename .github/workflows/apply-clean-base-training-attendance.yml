name: Apply clean base training attendance UI

on:
  push:
    branches:
      - codex/clean-base-training-attendance-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/clean-base-training-attendance-20260916
      - name: Apply focused changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, f'pattern not found in {path}: {old[:100]!r}'
              p.write_text(s.replace(old, new, 1))

          # New report: keep Yakum / Greenwork snapshots, but do not show those fields for base training.
          replace_once(
              'attendance/src/screens/new-report-screen.js',
              """    activityNameSel?.reset();\n    clearMeetingSelection();\n    syncLocationDependencies();\n    syncDateWarning();\n""",
              """    activityNameSel?.reset();\n    clearMeetingSelection();\n    setLocationFieldsVisible(!isOpenFieldType());\n    syncLocationDependencies();\n    syncDateWarning();\n""",
          )
          replace_once(
              'attendance/src/screens/new-report-screen.js',
              """    syncAuthoritySchoolFromActivity(activity);\n    syncLocationDependencies();\n    await syncMeetingForSelectedDate();\n""",
              """    syncAuthoritySchoolFromActivity(activity);\n    setLocationFieldsVisible(!isBaseTrainingActivity(activity));\n    syncLocationDependencies();\n    await syncMeetingForSelectedDate();\n""",
          )

          # Shared summary card: base training is intentionally compact and omits hidden technical location fields.
          replace_once(
              'attendance/src/components/report-summary-row.js',
              """function normalizedLabel(value) {\n  return String(value || '').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('he-IL');\n}\n\nfunction mobileToneForActivityType(value) {\n""",
              """function normalizedLabel(value) {\n  return String(value || '').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('he-IL');\n}\n\nexport function isBaseTrainingRecord(record = {}) {\n  return normalizedLabel(record.activity_type) === normalizedLabel('הכשרה')\n    && normalizedLabel(record.activity_name_snapshot || record.program_name_snapshot) === normalizedLabel('הכשרת בסיס');\n}\n\nfunction mobileToneForActivityType(value) {\n""",
          )
          replace_once(
              'attendance/src/components/report-summary-row.js',
              """  const secondary = [];\n  [record.program_name_snapshot, record.school_name_snapshot, record.authority_name_snapshot]\n    .map((value) => String(value || '').trim()).filter(Boolean).forEach((value) => {\n""",
              """  const secondary = [];\n  const contextValues = isBaseTrainingRecord(record)\n    ? [record.program_name_snapshot]\n    : [record.program_name_snapshot, record.school_name_snapshot, record.authority_name_snapshot];\n  contextValues\n    .map((value) => String(value || '').trim()).filter(Boolean).forEach((value) => {\n""",
          )
          replace_once(
              'attendance/src/components/report-summary-row.js',
              """  const presentation = reportPresentation(record);\n  activity.textContent = presentation.activity;\n""",
              """  const presentation = reportPresentation(record);\n  const baseTraining = isBaseTrainingRecord(record);\n  activity.textContent = presentation.activity;\n""",
          )
          replace_once(
              'attendance/src/components/report-summary-row.js',
              """  addDetail(details, 'תאריך', formatDate(record.report_date));\n  addDetail(details, 'שעות', `${formatTime(record.start_time)}–${formatTime(record.end_time)}`);\n  addDetail(details, 'סה״כ שעות', Number(record.total_hours || 0).toFixed(2));\n  addDetail(\n    details,\n    'ביטול זמן',\n    compensation?.calculation_status === 'resolved'\n      ? formatTravelMinutes(compensation.final_cancellation_minutes)\n      : compensation\n        ? 'ממתין לחישוב'\n        : '—'\n  );\n  addDetail(details, 'סוג פעילות', record.activity_type || '—');\n  addDetail(details, 'שם פעילות', presentation.activity, { wide: true });\n  addDetail(details, 'בית ספר', record.school_name_snapshot || '—');\n  addDetail(details, 'רשות', record.authority_name_snapshot || '—');\n  if (record.meeting_no != null) addDetail(details, 'מפגש', record.meeting_no);\n  addDetail(details, 'ק״מ', Number(record.roundtrip_km || 0).toFixed(0));\n  addDetail(details, 'תחבורה ציבורית', record.public_transport ? 'כן' : 'לא');\n  if (Number(record.public_transport_cost || 0) > 0) {\n    addDetail(details, 'עלות תחבורה ציבורית', `₪${Number(record.public_transport_cost || 0).toFixed(2)}`);\n  }\n  addDetail(details, 'הוצאות', `₪${Number(record.expenses || 0).toFixed(2)}`);\n  if (record.expense_details) addDetail(details, 'פירוט הוצאות', record.expense_details, { wide: true });\n  if (record.notes) addDetail(details, 'הערות', record.notes, { wide: true });\n  if (record.attachments?.length || record.attachment_names) addDetail(details, 'קבצים', record.attachment_names || `${record.attachments.length} קבצים`, { wide: true });\n  addDetail(details, 'סטטוס', record.status || 'פתוח', { wide: true });\n""",
              """  addDetail(details, 'תאריך', formatDate(record.report_date));\n  addDetail(details, 'שעות', `${formatTime(record.start_time)}–${formatTime(record.end_time)}`);\n  addDetail(details, 'סה״כ שעות', Number(record.total_hours || 0).toFixed(2));\n  if (!baseTraining || compensation?.calculation_status !== 'resolved' || Number(compensation?.final_cancellation_minutes || 0) > 0) {\n    if (!baseTraining || compensation) {\n      addDetail(\n        details,\n        'ביטול זמן',\n        compensation?.calculation_status === 'resolved'\n          ? formatTravelMinutes(compensation.final_cancellation_minutes)\n          : compensation\n            ? 'ממתין לחישוב'\n            : '—'\n      );\n    }\n  }\n  addDetail(details, 'סוג פעילות', record.activity_type || '—');\n  addDetail(details, 'שם פעילות', presentation.activity, { wide: true });\n  if (!baseTraining) {\n    addDetail(details, 'בית ספר', record.school_name_snapshot || '—');\n    addDetail(details, 'רשות', record.authority_name_snapshot || '—');\n    if (record.meeting_no != null) addDetail(details, 'מפגש', record.meeting_no);\n  }\n  const km = Number(record.roundtrip_km || 0);\n  const publicTransportCost = Number(record.public_transport_cost || 0);\n  const expenses = Number(record.expenses || 0);\n  if (!baseTraining || (!record.public_transport && km > 0)) addDetail(details, 'ק״מ', km.toFixed(0));\n  if (!baseTraining || record.public_transport) addDetail(details, 'תחבורה ציבורית', record.public_transport ? 'כן' : 'לא');\n  if (publicTransportCost > 0) {\n    addDetail(details, 'עלות תחבורה ציבורית', `₪${publicTransportCost.toFixed(2)}`);\n  }\n  if (!baseTraining || expenses > 0) addDetail(details, 'הוצאות', `₪${expenses.toFixed(2)}`);\n  if (record.expense_details) addDetail(details, 'פירוט הוצאות', record.expense_details, { wide: true });\n  if (record.notes) addDetail(details, 'הערות', record.notes, { wide: true });\n  if (record.attachments?.length || record.attachment_names) addDetail(details, 'קבצים', record.attachment_names || `${record.attachments.length} קבצים`, { wide: true });\n  if (!baseTraining) addDetail(details, 'סטטוס', record.status || 'פתוח', { wide: true });\n""",
          )

          # My Reports: hide base-training location in the desktop row and in edit mode, while preserving fixed snapshots.
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              "import { reportPresentation } from '../components/report-summary-row.js';",
              "import { isBaseTrainingRecord, reportPresentation } from '../components/report-summary-row.js';",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """  row.className = 'av2-report-row';\n  row.dataset.recordId = record.id;\n\n  // ── 1. Date""",
              """  row.className = 'av2-report-row';\n  row.dataset.recordId = record.id;\n  const baseTraining = isBaseTrainingRecord(record);\n\n  // ── 1. Date""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """  schoolCell.className = 'av2-rr__school';\n  schoolCell.textContent = record.school_name_snapshot || '—';\n\n  // ── 8. Authority""",
              """  schoolCell.className = 'av2-rr__school';\n  schoolCell.textContent = baseTraining ? '—' : (record.school_name_snapshot || '—');\n\n  // ── 8. Authority""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """  authCell.className = 'av2-rr__authority';\n  authCell.textContent = record.authority_name_snapshot || '—';\n""",
              """  authCell.className = 'av2-rr__authority';\n  authCell.textContent = baseTraining ? '—' : (record.authority_name_snapshot || '—');\n""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """    const isOperations = reportType === OPERATIONS_REPORT_TYPE;\n    const isZoom = reportType === ONLINE_REPORT_TYPE;\n    const isCourse = reportType === COURSE_REPORT_TYPE;\n\n    const activityLabel""",
              """    const isOperations = reportType === OPERATIONS_REPORT_TYPE;\n    const isZoom = reportType === ONLINE_REPORT_TYPE;\n    const isCourse = reportType === COURSE_REPORT_TYPE;\n    const isBaseTraining = reportType === 'הכשרה' && actNameField.input.value.trim() === 'הכשרת בסיס';\n\n    const activityLabel""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """    authField.wrap.hidden = isOperations;\n    schoolField.wrap.hidden = isOperations;\n""",
              """    authField.wrap.hidden = isOperations || isBaseTraining;\n    schoolField.wrap.hidden = isOperations || isBaseTraining;\n""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """  typeField.input.addEventListener('change', syncEditTypeUi);\n  syncEditTypeUi();\n""",
              """  typeField.input.addEventListener('change', syncEditTypeUi);\n  actNameField.input.addEventListener('input', syncEditTypeUi);\n  syncEditTypeUi();\n""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """    const isOperations = reportType === OPERATIONS_REPORT_TYPE;\n    const isZoom = reportType === ONLINE_REPORT_TYPE;\n    const isCourse = reportType === COURSE_REPORT_TYPE;\n\n    const missing = [];""",
              """    const isOperations = reportType === OPERATIONS_REPORT_TYPE;\n    const isZoom = reportType === ONLINE_REPORT_TYPE;\n    const isCourse = reportType === COURSE_REPORT_TYPE;\n    const isBaseTraining = reportType === 'הכשרה' && actNameField.input.value.trim() === 'הכשרת בסיס';\n\n    const missing = [];""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """    if (!isOperations && !authField.input.value.trim()) missing.push('רשות');\n""",
              """    if (!isOperations && !isBaseTraining && !authField.input.value.trim()) missing.push('רשות');\n""",
          )
          replace_once(
              'attendance/src/screens/my-reports-screen.js',
              """        activity_id:             isOperations ? null : (record.activity_id ?? null),\n        activity_row_id:         isOperations ? null : (record.activity_row_id ?? null),\n        activity_no:             isOperations ? null : (record.activity_no ?? null),\n        activity_season:         isOperations ? null : (record.activity_season ?? null),\n        activity_name_snapshot:  actNameField.input.value.trim() || null,\n        authority_id:            isOperations ? null : (record.authority_id ?? null),\n        authority_name_snapshot: isOperations ? null : (authField.input.value.trim() || null),\n        school_id:               isOperations ? null : (record.school_id ?? null),\n        school_name_snapshot:    isOperations ? null : (schoolField.input.value.trim() || null),\n        semel_mosad:             isOperations ? null : (record.semel_mosad ?? null),\n        meeting_no:              isCourse && meetField.input.value ? Number(meetField.input.value) : null,\n        program_name:            isOperations ? null : (record.program_name ?? null),\n""",
              """        activity_id:             isOperations || isBaseTraining ? null : (record.activity_id ?? null),\n        activity_row_id:         isOperations || isBaseTraining ? null : (record.activity_row_id ?? null),\n        activity_no:             isOperations || isBaseTraining ? null : (record.activity_no ?? null),\n        activity_season:         isOperations || isBaseTraining ? null : (record.activity_season ?? null),\n        activity_name_snapshot:  actNameField.input.value.trim() || null,\n        authority_id:            isOperations || isBaseTraining ? null : (record.authority_id ?? null),\n        authority_name_snapshot: isOperations ? null : (isBaseTraining ? 'יקום' : (authField.input.value.trim() || null)),\n        school_id:               isOperations || isBaseTraining ? null : (record.school_id ?? null),\n        school_name_snapshot:    isOperations ? null : (isBaseTraining ? 'Greenwork' : (schoolField.input.value.trim() || null)),\n        semel_mosad:             isOperations || isBaseTraining ? null : (record.semel_mosad ?? null),\n        meeting_no:              isCourse && meetField.input.value ? Number(meetField.input.value) : null,\n        program_name:            isOperations || isBaseTraining ? null : (record.program_name ?? null),\n""",
          )

          # Extend focused regression tests.
          p = Path('tests/attendance-base-training.test.mjs')
          s = p.read_text()
          s = s.replace(
              "const source = await readFile(new URL('../attendance/src/screens/new-report-screen.js', import.meta.url), 'utf8');\n",
              "const source = await readFile(new URL('../attendance/src/screens/new-report-screen.js', import.meta.url), 'utf8');\nconst reportsSource = await readFile(new URL('../attendance/src/screens/my-reports-screen.js', import.meta.url), 'utf8');\nconst summarySource = await readFile(new URL('../attendance/src/components/report-summary-row.js', import.meta.url), 'utf8');\n",
              1,
          )
          s += """\n\ntest('base training hides fixed location fields from creation and editing UI', () => {\n  assert.match(source, /setLocationFieldsVisible\(!isBaseTrainingActivity\(activity\)\)/);\n  assert.match(reportsSource, /isBaseTraining = reportType === 'הכשרה'[\\s\\S]*actNameField\\.input\\.value\\.trim\\(\\) === 'הכשרת בסיס'/);\n  assert.match(reportsSource, /authField\\.wrap\\.hidden = isOperations \\|\\| isBaseTraining/);\n  assert.match(reportsSource, /schoolField\\.wrap\\.hidden = isOperations \\|\\| isBaseTraining/);\n  assert.match(reportsSource, /authority_name_snapshot: isOperations \\? null : \\(isBaseTraining \\? 'יקום'/);\n  assert.match(reportsSource, /school_name_snapshot:\\s+isOperations \\? null : \\(isBaseTraining \\? 'Greenwork'/);\n});\n\ntest('base training summary omits technical school, authority and empty reimbursement details', () => {\n  assert.match(summarySource, /export function isBaseTrainingRecord/);\n  assert.match(summarySource, /if \\(!baseTraining\\) \\{[\\s\\S]*'בית ספר'[\\s\\S]*'רשות'/);\n  assert.match(summarySource, /if \\(!baseTraining \\|\\| \\(!record\\.public_transport && km > 0\\)\\)/);\n  assert.match(summarySource, /if \\(!baseTraining \\|\\| expenses > 0\\)/);\n  assert.match(summarySource, /if \\(!baseTraining\\) addDetail\\(details, 'סטטוס'/);\n  assert.match(reportsSource, /schoolCell\\.textContent = baseTraining \\? '—'/);\n  assert.match(reportsSource, /authCell\\.textContent = baseTraining \\? '—'/);\n});\n"""
          p.write_text(s)

          # Cache bump for changed Attendance JS.
          for path in ['attendance/index.html', 'attendance/sw.js', 'tests/attendance-activity-type-behavior.test.mjs', 'tests/attendance-screen-structure.test.mjs']:
              p = Path(path)
              s = p.read_text().replace('CACHE_VERSION = 69', 'CACHE_VERSION = 70').replace('?v=69', '?v=70').replace('?v=68', '?v=69')
              # In cache tests the negative assertion should track the immediately previous version.
              if path.endswith('attendance-activity-type-behavior.test.mjs'):
                  s = s.replace("doesNotMatch(indexSource, /\\?v=69/)", "doesNotMatch(indexSource, /\\?v=69/)")
              p.write_text(s)

          # Remove the stale temporary formatter workflow that accidentally survived PR #1846.
          stale = Path('.github/workflows/cleanup-base-training-format.yml')
          if stale.exists(): stale.unlink()
          PY
      - name: Normalize cache test negative assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/attendance-activity-type-behavior.test.mjs')
          s = p.read_text()
          # Ensure the current version is 70 and only the previous 69 is rejected.
          s = s.replace("assert.doesNotMatch(indexSource, /\\?v=70/);", "assert.doesNotMatch(indexSource, /\\?v=69/);")
          p.write_text(s)
          PY
      - name: Verify focused behavior
        run: |
          node --test tests/attendance-base-training.test.mjs tests/attendance-activity-type-behavior.test.mjs tests/attendance-screen-structure.test.mjs
          npm run ci:quick
      - name: Commit final patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-clean-base-training-attendance.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add -A
          git commit -m "Clean base training attendance details"
          git push origin HEAD:codex/clean-base-training-attendance-20260916
