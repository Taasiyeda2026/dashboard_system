name: Temporary Saved Feedback PDF Validation
on:
  push:
    branches: [feat/feedback-admin-saved-print-pdfs-20261009]
jobs:
  saved-paper-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate saved PDF workflow and admin security contracts
        run: node --test tests/impact-feedback-paper-pdf.test.mjs
      - name: Build frontend
        run: npm run build
