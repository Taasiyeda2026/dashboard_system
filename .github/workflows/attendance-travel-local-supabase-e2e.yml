name: Attendance travel isolated Supabase Auth and RPC

on:
  pull_request:
    branches: [main]
    paths:
      - 'attendance/src/services/daily-travel.service.js'
      - 'attendance/src/screens/daily-travel-tab.js'
      - 'tests/attendance-travel-live-local.test.mjs'
      - '.github/workflows/attendance-travel-local-supabase-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.78.1
      - name: Start a disposable localhost-only Supabase stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          mkdir -p work/attendance-travel-qa/supabase
          printf 'project_id = "attendance-travel-qa-ci"\n' > work/attendance-travel-qa/supabase/config.toml
          supabase start --workdir work/attendance-travel-qa --exclude studio,realtime,storage-api,imgproxy,postgres-meta,mailpit,edge-runtime,logflare,vector,supavisor
          supabase status --workdir work/attendance-travel-qa
      - name: Verify login and saving through actual Supabase Auth and PostgREST RPC
        run: node --test tests/attendance-travel-live-local.test.mjs
      - name: Stop disposable Supabase instance
        if: always()
        run: supabase stop --project-id attendance-travel-qa-ci --no-backup || true
