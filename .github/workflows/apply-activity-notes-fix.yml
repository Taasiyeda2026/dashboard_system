name: Apply activity notes projection fix

on:
  push:
    branches:
      - fix/activity-table-notes-20260913
    paths:
      - .github/workflows/apply-activity-notes-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-table-notes-20260913
          fetch-depth: 0
      - name: Apply targeted fix and clean temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/api.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('const ACTIVITY_TABLE_COLUMNS = [')
          end = s.index("].join(',');", start)
          block = s[start:end]
          if "'notes'" not in block:
              old = "  'start_date', 'end_date', 'status',\n"
              if block.count(old) != 1:
                  raise SystemExit('target line not found exactly once')
              block = block.replace(old, "  'start_date', 'end_date', 'status', 'notes',\n", 1)
              s = s[:start] + block + s[end:]
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .tmp-verify-placeholder noop.txt noop2.txt noop3.txt noop4.txt noop5.txt noop6.txt
          rm -f .github/workflows/apply-activity-notes-fix.yml
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: include activity notes in table projection'
          git push origin HEAD:fix/activity-table-notes-20260913
