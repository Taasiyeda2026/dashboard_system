name: Convert summer catalog image 002 to WebP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-summercatalog-002-webp.yml"

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert image and refresh cache
        run: |
          cwebp -quiet -q 86 -m 6 \
            frontend/public/catalog/summercatalog/image/002.png \
            -o frontend/public/catalog/summercatalog/image/002.webp
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/sw.js")
          text = path.read_text(encoding="utf-8")
          old = "const CACHE_VERSION = 1283;"
          new = "const CACHE_VERSION = 1284;"
          if old not in text:
              raise SystemExit("Expected CACHE_VERSION 1283 was not found in frontend/sw.js")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit generated WebP and cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/catalog/summercatalog/image/002.webp frontend/sw.js
          git commit -m "Convert summer catalog image 002 to WebP and refresh cache"
          git push
