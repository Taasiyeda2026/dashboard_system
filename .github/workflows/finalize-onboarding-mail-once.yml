name: Finalize onboarding mail once

on:
  push:
    branches:
      - main
    paths:
      - .tmp/finalize-onboarding-mail.ready

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused mail, manager wording, and test updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('frontend/src/screens/instructor-onboarding.js')
          s = js_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              s = s.replace(old, new, 1)

          def regex_once(pattern, replacement, label):
              global s
              s2, count = re.subn(pattern, lambda _m: replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              s = s2

          replace_once(
              "function isFemaleGender(value) {\n  return String(value || '').trim().toLowerCase() === 'female';\n}",
              "function normalizeGender(value) {\n  const normalized = String(value || '').trim().toLowerCase();\n  return ['male', 'female'].includes(normalized) ? normalized : '';\n}\n\nfunction isFemaleGender(value) {\n  return normalizeGender(value) === 'female';\n}",
              'gender helper'
          )

          mail_block = '''const AVAILABILITY = `לצורך תכנון השיבוצים והפעילויות, נבקש להשיב למייל זה ולמלא את פרטי הזמינות שלך בצורה מלאה ככל האפשר:

מועד שממנו ניתן להתחיל להדריך:
תאריך: _______________

זמינות קבועה במהלך השבוע:

יום א׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______
יום ב׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______
יום ג׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______
יום ד׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______
יום ה׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______
יום ו׳ – פנוי/ה: כן / לא | משעה: _______ | עד שעה: _______

אילוצים קבועים שחשוב שנכיר:

---

תאריכים קרובים שבהם ידוע מראש שלא תהיה זמינות:

---`;

function availabilityForGender(gender) {
  const normalized = normalizeGender(gender);
  const availabilityWord = normalized === 'female' ? 'פנויה' : normalized === 'male' ? 'פנוי' : 'פנוי/ה';
  return AVAILABILITY.replaceAll('פנוי/ה', availabilityWord);
}

function managerRoleCopy(manager = {}) {
  const managerGender = normalizeGender(manager?.gender);
  if (managerGender === 'female') {
    return {
      heading: 'מנהלת הפעילות שלך',
      relationship: 'מנהלת הפעילות היא המנהלת הישירה שלך והכתובת המרכזית לכל שאלה או עניין שוטף בעבודה.'
    };
  }
  if (managerGender === 'male') {
    return {
      heading: 'מנהל הפעילות שלך',
      relationship: 'מנהל הפעילות הוא המנהל הישיר שלך והכתובת המרכזית לכל שאלה או עניין שוטף בעבודה.'
    };
  }
  return {
    heading: 'מנהל/ת הפעילות שלך',
    relationship: 'מנהל/ת הפעילות הוא/היא המנהל/ת הישיר/ה שלך והכתובת המרכזית לכל שאלה או עניין שוטף בעבודה.'
  };
}

function welcomeLineForGender(gender) {
  const normalized = normalizeGender(gender);
  if (normalized === 'female') return 'בהצלחה וברוכה הבאה לצוות תעשיידע!';
  if (normalized === 'male') return 'בהצלחה וברוך הבא לצוות תעשיידע!';
  return 'בהצלחה וברוכים הבאים לצוות תעשיידע!';
}

export function buildOnboardingMail(employmentType, manager, instructorName = '', gender = '') {
  const taasiyeda = employmentType === 'taasiyeda';
  const documents = onboardingDocumentsForGender(employmentType, gender);
  const documentLines = documents.map((name) => `- ${name}`).join('\\n');
  const instruction = taasiyeda
    ? 'נבקש לעבור על הסכם ההעסקה, לחתום עליו ולהחזיר אלינו עותק חתום במייל חוזר.'
    : 'נבקש לעבור על המסמכים המצורפים, למלא ולחתום ככל שנדרש ולהחזיר אלינו את המסמכים הרלוונטיים במייל חוזר.';
  const managerCopy = managerRoleCopy(manager);
  const body = `שלום ${String(instructorName || '').trim()},

שמחים על הצטרפותך לצוות המדריכים של תעשיידע!

מצורפים למייל המסמכים הנדרשים לצורך השלמת תהליך הקליטה:

${documentLines}

${instruction}

את כלל המסמכים הנדרשים לתהליך הקליטה, כשהם מלאים וחתומים ככל שנדרש, יש להשלים ולהחזיר אלינו לא יאוחר מיום לפני תחילת העבודה.

${availabilityForGender(gender)}

${managerCopy.heading}:
${manager.name} | ${manager.phone}

${managerCopy.relationship}

בימים הקרובים ייצרו איתך קשר לתיאום מועד ההכשרה לקראת תחילת ההדרכות.

נשמח ללוות אותך בתחילת הדרך בתעשיידע. לכל שאלה או צורך ניתן לפנות אלינו.

${welcomeLineForGender(gender)}`;
  return { subject: SUBJECT, body };
}

export function managerContactsFromSettings'''
          regex_once(
              r"const AVAILABILITY = `.*?`;\n\nexport function buildOnboardingMail\(.*?\n\}\n\nexport function managerContactsFromSettings",
              mail_block,
              'gendered mail block'
          )

          contacts_block = '''export function managerContactsFromSettings(settings = {}) {
  const value = settings.activity_manager_contacts;
  if (Array.isArray(value)) return value;
  if (value && typeof value === 'object') {
    return Object.entries(value).map(([name, contact]) => typeof contact === 'object'
      ? ({ name, phone: String(contact?.phone || '').trim(), email: String(contact?.email || '').trim(), gender: normalizeGender(contact?.gender) })
      : ({ name, phone: String(contact || '').trim(), email: '', gender: '' }));
  }
  return [];
}

export function onboardingManagers(settings = {}) {
  const active = Array.isArray(settings?.dropdown_options?.activities_manager_users)
    ? settings.dropdown_options.activities_manager_users.filter((item) => item?.is_active !== false)
    : [];
  const contacts = managerContactsFromSettings(settings);
  const contactByName = new Map(contacts.map((item) => [String(item?.name || '').trim(), item]));
  return active.map((item) => {
    const name = String(item?.name || '').trim();
    const contact = contactByName.get(name) || {};
    return {
      name,
      phone: String(contact.phone || '').trim(),
      email: String(contact.email || '').trim(),
      gender: normalizeGender(contact.gender)
    };
  }).filter((item) => item.name);
}

export function onboardingModalHtml'''
          regex_once(
              r"export function managerContactsFromSettings\(settings = \{\}\) \{.*?\n\}\n\nexport function onboardingManagers\(settings = \{\}\) \{.*?\n\}\n\nexport function onboardingModalHtml",
              contacts_block,
              'manager contact metadata'
          )

          js_path.write_text(s, encoding='utf-8')

          test_path = Path('tests/instructor-onboarding.test.mjs')
          t = test_path.read_text(encoding='utf-8')

          def t_replace_once(old, new, label):
              global t
              count = t.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              t = t.replace(old, new, 1)

          t_replace_once(
              "import { buildOnboardingMail, onboardingManagers, onboardingModalHtml, bindOnboardingModal, createOnboardingInstructor } from '../frontend/src/screens/instructor-onboarding.js';",
              "import { buildOnboardingMail, onboardingDocumentsForGender, onboardingManagers, onboardingModalHtml, bindOnboardingModal, createOnboardingInstructor } from '../frontend/src/screens/instructor-onboarding.js';",
              'test imports'
          )
          t_replace_once(
              "{ name: 'גיל נאמן', phone: '052-4506699', email: 'GilNeeman@think.org.il' },\n    { name: 'הילה רוזן', phone: '052-3222951', email: 'HilaR@think.org.il' }",
              "{ name: 'גיל נאמן', phone: '052-4506699', email: 'GilNeeman@think.org.il', gender: 'male' },\n    { name: 'הילה רוזן', phone: '052-3222951', email: 'HilaR@think.org.il', gender: 'female' }",
              'test manager genders'
          )
          t_replace_once(
              "function fill(modal, { manager = 'גיל נאמן', email = 'new@example.org', employmentType = 'taasiyeda', agency = '' } = {}) {",
              "function fill(modal, { manager = 'גיל נאמן', email = 'new@example.org', employmentType = 'taasiyeda', agency = '', gender = 'male' } = {}) {",
              'fill signature'
          )
          t_replace_once(
              "  const employment = modal.querySelector('[data-onboarding-employment]'); employment.value = employmentType; employment.dispatchEvent(new window.Event('change'));",
              "  const genderSelect = modal.querySelector('[data-onboarding-gender]'); genderSelect.value = gender; genderSelect.dispatchEvent(new window.Event('change'));\n  const employment = modal.querySelector('[data-onboarding-employment]'); employment.value = employmentType; employment.dispatchEvent(new window.Event('change'));",
              'fill gender'
          )
          t_replace_once(
              "test('five required onboarding fields gate the compact RTL primary action', () => {",
              "test('six required onboarding fields gate the compact RTL primary action', () => {",
              'required-fields test name'
          )
          t_replace_once("assert.equal(root.querySelectorAll('select').length, 3);", "assert.equal(root.querySelectorAll('select').length, 4);", 'select count')
          t_replace_once(
              "createOnboardingInstructor({ fullName: 'אייל', phone: 'בדיקה', email: 'a@example.org', employmentType: 'עצמאי', managerName: 'גיל' }),",
              "createOnboardingInstructor({ fullName: 'אייל', phone: 'בדיקה', email: 'a@example.org', gender: 'male', employmentType: 'עצמאי', managerName: 'גיל' }),",
              'phone guard gender'
          )
          t_replace_once(
              "assert.deepEqual(calls[0][1], { fullName: 'אייל ישראלי', phone: '0501234567', email: 'new@example.org', employmentType: 'מעוף', managerName: 'גיל נאמן' });",
              "assert.deepEqual(calls[0][1], { fullName: 'אייל ישראלי', phone: '0501234567', email: 'new@example.org', gender: 'male', employmentType: 'מעוף', managerName: 'גיל נאמן' });",
              'retry expected gender'
          )

          marker = "test('retry after Outlook failure uses the original staffing agency snapshot without another insert', async () => {"
          insert = '''test('mail and document list are gender-aware for instructor and activity manager', () => {
  const managers = onboardingManagers(settings);
  const gil = managers.find((manager) => manager.name === 'גיל נאמן');
  const hila = managers.find((manager) => manager.name === 'הילה רוזן');

  const maleMail = buildOnboardingMail('taasiyeda', gil, 'אייל ישראלי', 'male');
  assert.match(maleMail.body, /אישור משטרה/);
  assert.match(maleMail.body, /יום א׳ – פנוי:/);
  assert.match(maleMail.body, /מנהל הפעילות שלך:/);
  assert.match(maleMail.body, /מנהל הפעילות הוא המנהל הישיר שלך/);
  assert.match(maleMail.body, /ברוך הבא לצוות תעשיידע/);

  const femaleMail = buildOnboardingMail('taasiyeda', hila, 'איילת ישראלי', 'female');
  assert.doesNotMatch(femaleMail.body, /אישור משטרה/);
  assert.match(femaleMail.body, /יום א׳ – פנויה:/);
  assert.match(femaleMail.body, /מנהלת הפעילות שלך:/);
  assert.match(femaleMail.body, /מנהלת הפעילות היא המנהלת הישירה שלך/);
  assert.match(femaleMail.body, /ברוכה הבאה לצוות תעשיידע/);
  assert.deepEqual(onboardingDocumentsForGender('taasiyeda', 'female'), ['הסכם העסקה', 'טופס 101', 'נהלים למדריך']);
});

'''
          t_replace_once(marker, insert + marker, 'gender-aware mail test')

          old_edge = '''  assert.match(edge, /snapshot\\?\\.mapped && clean\\(snapshot\\?\\.folder_web_url\\)/);
  assert.match(edge, /"@microsoft\\.graph\\.conflictBehavior": "fail"/);
  assert.match(edge, /for \\(const relativePath of FOLDER_PATHS\\)[\\s\\S]+update_instructor_employee_folder_url/);
  assert.doesNotMatch(edge, /window\\.open|location\\.href/);'''
          new_edge = '''  assert.match(edge, /snapshot\\?\\.mapped && clean\\(snapshot\\?\\.folder_web_url\\)/);
  assert.match(edge, /"@microsoft\\.graph\\.conflictBehavior": "fail"/);
  assert.match(edge, /POLICE_CLEARANCE_FOLDER_PATH = "01 הסכם ומסמכים\\/אישור משטרה"/);
  assert.match(edge, /const isFemale = clean\\(snapshot\\?\\.gender\\)\\.toLowerCase\\(\\) === "female"/);
  assert.match(edge, /const folderPaths = isFemale \\? FOLDER_PATHS : \\[\\.\\.\\.FOLDER_PATHS, POLICE_CLEARANCE_FOLDER_PATH\\]/);
  assert.match(edge, /for \\(const relativePath of folderPaths\\)[\\s\\S]+update_instructor_onboarding_folder_url/);
  assert.doesNotMatch(edge, /window\\.open|location\\.href/);'''
          t_replace_once(old_edge, new_edge, 'edge folder test')

          test_path.write_text(t, encoding='utf-8')

          migration = Path('supabase/migrations/20260819193000_activity_manager_contact_gender.sql')
          migration.write_text('''-- Preserve the approved activity-manager contact records while adding explicit manager gender metadata
-- for gendered instructor-onboarding mail copy. No gender is inferred from a name at runtime.
update public.settings s
set value = (
  select jsonb_agg(
    case
      when item.elem->>'name' = 'גיל נאמן' then item.elem || '{"gender":"male"}'::jsonb
      when item.elem->>'name' = 'הילה רוזן' then item.elem || '{"gender":"female"}'::jsonb
      else item.elem
    end
    order by item.ord
  )::text
  from jsonb_array_elements(s.value::jsonb) with ordinality as item(elem, ord)
)
where s.key = 'activity_manager_contacts';
''', encoding='utf-8')
          PY

          node --check frontend/src/screens/instructor-onboarding.js
          npm ci --no-audit --no-fund
          node --test tests/instructor-onboarding.test.mjs
          git diff --check

          rm -f .tmp/finalize-onboarding-mail.ready
          rm -f .github/workflows/finalize-onboarding-mail-once.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalize gender-aware onboarding mail"
          git push origin HEAD:main
