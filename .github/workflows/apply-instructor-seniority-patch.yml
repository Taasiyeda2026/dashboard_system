name: Apply instructor seniority patch

on:
  push:
    branches:
      - fix/instructor-seniority-years-20260804

permissions:
  contents: write

jobs:
  patch-and-test:
    if: "!contains(github.event.head_commit.message, '[seniority-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instructor-seniority-years-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch instructor interface and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workspace = Path('frontend/src/screens/instructor-workspace-ui.js')
          text = workspace.read_text(encoding='utf-8')
          old = "import { INSTRUCTOR_WEEKDAYS } from './instructor-scheduling-data.js';\n"
          new = old + "import { formatInstructorSeniority, instructorSeniorityValues } from './instructor-seniority.js';\n"
          assert old in text and "instructor-seniority.js" not in text
          text = text.replace(old, new, 1)
          text = text.replace(
              "displayValue === '—' || displayValue === 'ללא'",
              "displayValue === '—' || displayValue === 'ללא' || displayValue === 'לא הוגדר'",
              1
          )
          old_profile = "${field('כתובת', row.address)}${field('סוג העסקה', row.employment_type)}${field('מנהל ישיר', row.direct_manager)}"
          new_profile = "${field('כתובת', row.address)}${field('סוג העסקה', row.employment_type)}${field('ותק', formatInstructorSeniority(row.seniority_years))}${field('מנהל ישיר', row.direct_manager)}"
          assert old_profile in text
          text = text.replace(old_profile, new_profile, 1)
          replacement = r'''export function contactForm(row) {
            const input = (label, name, value, type = 'text', dir = 'rtl') => `<label style="display:grid;gap:5px"><span class="ds-muted">${escapeHtml(label)}</span><input class="ds-input" type="${type}" name="${name}" value="${escapeHtml(value || '')}" dir="${dir}"></label>`;
            const select = (label, name, value, options) => `<label style="display:grid;gap:5px"><span class="ds-muted">${escapeHtml(label)}</span><select class="ds-input" name="${name}">${options.map((option) => `<option value="${escapeHtml(option.value)}"${String(option.value) === String(value ?? '') ? ' selected' : ''}>${escapeHtml(option.label)}</option>`).join('')}</select></label>`;
            const seniorityOptions = [{ value: '', label: 'לא הוגדר' }, ...instructorSeniorityValues().map((year) => ({ value: String(year), label: String(year) }))];
            return `<div dir="rtl" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${input('שם מלא','full_name',row.full_name)}${input('נייד','mobile',row.mobile,'tel','ltr')}${input('דוא״ל','email',row.email,'email','ltr')}${input('כתובת','address',row.address)}${input('סוג העסקה','employment_type',row.employment_type)}${select('ותק','seniority_years',row.seniority_years,seniorityOptions)}${input('מנהל ישיר','direct_manager',row.direct_manager)}<label style="display:grid;gap:5px"><span class="ds-muted">סטטוס</span><select class="ds-input" name="active"><option value="yes"${row.active === 'yes' ? ' selected' : ''}>פעיל</option><option value="no"${row.active === 'no' ? ' selected' : ''}>לא פעיל</option></select></label><p class="ds-muted" data-instructor-form-status style="grid-column:1/-1;margin:0"></p></div>`;
          }

          function defaultRule'''
          text, count = re.subn(
              r"export function contactForm\(row\) \{.*?\n\}\n\nfunction defaultRule",
              replacement,
              text,
              count=1,
              flags=re.S
          )
          assert count == 1
          workspace.write_text(text, encoding='utf-8')

          instructors = Path('frontend/src/screens/instructors.js')
          text = instructors.read_text(encoding='utf-8')
          import_anchor = "} from './instructor-scheduling-data.js';\n"
          import_new = import_anchor + "import { loadInstructorSeniorityData, saveInstructorContactDetails } from './instructor-contact-data.js';\n"
          assert import_anchor in text and "instructor-contact-data.js" not in text
          text = text.replace(import_anchor, import_new, 1)
          text = text.replace(
              "./instructor-workspace-ui.js?v=20260730-instructor-constraints-modal-v1",
              "./instructor-workspace-ui.js?v=20260804-instructor-seniority-v1",
              1
          )
          text = text.replace(
              "function mergeRows(base, contacts, scheduling) {",
              "function mergeRows(base, contacts, scheduling, seniorityRows = []) {",
              1
          )
          contacts_line = "  (contacts?.rows || []).forEach((row) => Object.assign(ensure(row.emp_id || row.full_name, row.full_name), row));\n"
          seniority_line = contacts_line + "  (seniorityRows || []).forEach((row) => Object.assign(ensure(row.emp_id), { seniority_years: row.seniority_years ?? null }));\n"
          assert contacts_line in text
          text = text.replace(contacts_line, seniority_line, 1)
          old_load = "    const [base, contacts] = await Promise.all([api.instructors(), api.instructorContacts()]);\n    return { ...base, rows: mergeRows(base, contacts, null), scheduling: null, _schedulingLoaded: false };"
          new_load = "    const [base, contacts, seniorityRows] = await Promise.all([api.instructors(), api.instructorContacts(), loadInstructorSeniorityData()]);\n    return { ...base, rows: mergeRows(base, contacts, null, seniorityRows), scheduling: null, _schedulingLoaded: false };"
          assert old_load in text
          text = text.replace(old_load, new_load, 1)
          old_payload = "const payload = { emp_id: row.emp_id, full_name: get('full_name'), mobile: get('mobile'), email: get('email'), address: get('address'), employment_type: get('employment_type'), direct_manager: get('direct_manager') || 'ללא', active: get('active') || 'yes' };"
          new_payload = "const payload = { emp_id: row.emp_id, full_name: get('full_name'), mobile: get('mobile'), email: get('email'), address: get('address'), employment_type: get('employment_type'), seniority_years: get('seniority_years'), direct_manager: get('direct_manager') || 'ללא', active: get('active') || 'yes' };"
          assert old_payload in text
          text = text.replace(old_payload, new_payload, 1)
          old_save = "try { button.disabled = true; await api.saveContact({ kind: 'instructor', row: payload }); Object.assign(row, payload); clearScreenDataCache?.(); ui.closeModal(); showToast('פרטי המדריך נשמרו', 'success', 1800); rerender(); reopen?.(); }"
          new_save = "try { button.disabled = true; const saved = await saveInstructorContactDetails(payload); Object.assign(row, payload, saved || {}); clearScreenDataCache?.(); ui.closeModal(); showToast('פרטי המדריך נשמרו', 'success', 1800); rerender(); reopen?.(); }"
          assert old_save in text
          text = text.replace(old_save, new_save, 1)
          instructors.write_text(text, encoding='utf-8')

          sw = Path('frontend/sw.js')
          text = sw.read_text(encoding='utf-8')
          assert 'const CACHE_VERSION = 1390;' in text
          sw.write_text(text.replace('const CACHE_VERSION = 1390;', 'const CACHE_VERSION = 1391;', 1), encoding='utf-8')

          Path('.github/workflows/apply-instructor-seniority-patch.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: |
          node --test tests/instructor-seniority.test.mjs
          node --check frontend/src/screens/instructor-seniority.js
          node --check frontend/src/screens/instructor-contact-data.js
          node --check frontend/src/screens/instructor-workspace-ui.js
          node --check frontend/src/screens/instructors.js
          npm run check:pwa
          npm run check:build
          git diff --check

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/instructor-seniority.js \
                  frontend/src/screens/instructor-contact-data.js \
                  frontend/src/screens/instructor-workspace-ui.js \
                  frontend/src/screens/instructors.js \
                  frontend/sw.js \
                  supabase/migrations/20260804190000_instructor_seniority_years.sql \
                  tests/instructor-seniority.test.mjs \
                  .github/workflows/apply-instructor-seniority-patch.yml
          git commit -m "feat: add instructor seniority years [seniority-patch]"
          git push origin HEAD:fix/instructor-seniority-years-20260804
