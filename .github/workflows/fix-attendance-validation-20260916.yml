name: Fix attendance validation 20260916

on:
  push:
    branches:
      - codex/fix-attendance-validation-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-attendance-validation-20260916
          fetch-depth: 0

      - name: Apply scoped patch
        run: |
          python scripts/fix_attendance_validation_20260916.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/update_attendance_validation_tests_20260916.py')
          text = path.read_text()
          old = r"(?=\n\ntest\(|\Z)"
          new = r"(?=\n\s*test\(|\s*\Z)"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/update_attendance_validation_tests_20260916.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify attendance validation
        shell: bash
        run: |
          set +e
          node --test tests/attendance-validation-record-km.test.mjs tests/attendance-control.test.mjs tests/attendance-control-manager-admin-parity.test.mjs 2>&1 | tee attendance-test-output.txt
          status=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-test-output
          path: attendance-test-output.txt

      - name: Fail on test errors
        if: env.TEST_EXIT_CODE != '0'
        run: exit 1

      - name: Commit verified fix
        shell: bash
        run: |
          rm scripts/fix_attendance_validation_20260916.py
          rm scripts/update_attendance_validation_tests_20260916.py
          rm .github/workflows/fix-attendance-validation-20260916.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add frontend/src/screens/attendance-control.js tests/attendance-control.test.mjs tests/attendance-control-manager-admin-parity.test.mjs tests/attendance-validation-record-km.test.mjs scripts/fix_attendance_validation_20260916.py scripts/update_attendance_validation_tests_20260916.py .github/workflows/fix-attendance-validation-20260916.yml
          git commit -m "Fix attendance activity and per-record km validation"
          git push origin HEAD:codex/fix-attendance-validation-20260916
