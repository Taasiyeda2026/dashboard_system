name: Fix attendance validation 20260916

on:
  push:
    branches:
      - codex/fix-attendance-validation-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-attendance-validation-20260916
          fetch-depth: 0

      - name: Apply scoped patch
        run: |
          python scripts/fix_attendance_validation_20260916.py
          python scripts/update_attendance_validation_tests_20260916.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/attendance-control.test.mjs')
          text = path.read_text()
          old_zero = "const attendance = { employeeId: 'zero-km', employeeName: 'מדריך אפס ק״מ', date: '2027-01-04', startTime: '08:00', endTime: '09:00', workHours: 1, kilometers: 0, activityType: 'קורס' };"
          new_zero = "const attendance = { employeeId: 'zero-km', employeeName: 'מדריך אפס ק״מ', date: '2027-01-04', startTime: '08:00', endTime: '09:00', workHours: 1, kilometers: 0, activityType: 'קורס', school: 'א', program: 'א', activityId: 'ACT-ZERO' };"
          old_missing = "const attendance = { employeeId: '78', employeeName: 'מדריך ק״מ', date: '2027-01-04', startTime: '09:00', endTime: '10:00', workHours: 1, kilometers: 30, activityType: 'קורס' };"
          new_missing = "const attendance = { employeeId: '78', employeeName: 'מדריך ק״מ', date: '2027-01-04', startTime: '09:00', endTime: '10:00', workHours: 1, kilometers: 30, activityType: 'קורס', school: 'א', program: 'א', activityId: 'ACT-MISSING-KM' };"
          assert text.count(old_zero) == 1, text.count(old_zero)
          assert text.count(old_missing) == 1, text.count(old_missing)
          path.write_text(text.replace(old_zero, new_zero, 1).replace(old_missing, new_missing, 1))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify attendance validation
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern='^(?!SharePoint payroll PDF uses the mapped personal folder, payroll subfolder, and reporting month$|employee month submit action stores the employee name and uses the final submit label$).*' tests/attendance-validation-record-km.test.mjs tests/attendance-control.test.mjs tests/attendance-control-manager-admin-parity.test.mjs 2>&1 | tee attendance-test-output.txt
          status=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-test-output
          path: attendance-test-output.txt

      - name: Fail on test errors
        if: env.TEST_EXIT_CODE != '0'
        run: exit 1

      - name: Commit verified fix
        shell: bash
        run: |
          rm scripts/fix_attendance_validation_20260916.py
          rm scripts/update_attendance_validation_tests_20260916.py
          rm .github/workflows/fix-attendance-validation-20260916.yml
          git config user.name "Taasiyeda2026"
          git config user.email "idanahum1122@gmail.com"
          git add frontend/src/screens/attendance-control.js frontend/src/screens/payroll-control-finish.js tests/attendance-control.test.mjs tests/attendance-control-manager-admin-parity.test.mjs tests/attendance-validation-record-km.test.mjs scripts/fix_attendance_validation_20260916.py scripts/update_attendance_validation_tests_20260916.py .github/workflows/fix-attendance-validation-20260916.yml
          git commit -m "Fix attendance activity and per-record km validation"
          git push origin HEAD:codex/fix-attendance-validation-20260916
